[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-router"
version = "0.1.0"
description = "Adaptive hierarchical tool intelligence router (FastAPI service + stdio bridge worker)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "celery>=5.5.0",
  "kombu>=5.5.0",
]

[project.optional-dependencies]
# 连接外部向量库/图谱/队列等基础设施时才需要（纯内存模式不依赖）
infra = [
  "httpx>=0.28.0",
  "redis>=6.4.0",
  "qdrant-client>=1.15.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "neo4j>=5.28.0",
  "opentelemetry-sdk>=1.36.0",
  "prometheus-client>=0.22.0",
]

[tool.setuptools.packages.find]
include = ["tool_router*"]

[tool.pytest.ini_options]
pythonpath = ["."]
