  --pa-font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
}

  --pa-glass-bg: rgba(28, 31, 38, 0.85);

  --pa-shadow-md: 0 2px 12px rgba(0, 0, 0, 0.4);
  --pa-shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
}

<body class="min-h-screen font-sans antialiased">
    <main class="entrance-root">
      <div class="ambient-glow" aria-hidden="true"></div>

        <span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span>
      </div>
      <section class="entrance-stage">
        <div class="entrance-copy">
          <div class="title-wrap">
            <h1 class="title-shadow" aria-hidden="true">NEXTBOT</h1>
            <div class="title-layer">
              <h1 class="title-base">NEXTBOT</h1>
              <h1 class="title-scan" aria-hidden="true">NEXTBOT</h1>
            </div>
          </div>
          <p class="subtitle">SYSTEM ONLINE</p>
        </div>

    </main>
    <style>
      body {
        background: #000;
        overflow: hidden;
        font-family: var(--pa-font-sans);
      }

      .entrance-root {
        position: fixed;
        inset: 0;
        background: #000;
        animation: stage-fade-out 1.2s ease-in 3s forwards;
      }

      .ambient-glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 70% 55% at center, rgba(0, 122, 255, 0.04) 0%, transparent 65%);
        opacity: 0;
        transform-origin: center;
        animation: ambient-breathe 4s ease-in-out 0.2s infinite;
      }

      @keyframes ambient-breathe {
        0% { opacity: 0; transform: scale(0.97); }
        6% { opacity: 0.5; }
        50% { opacity: 1; transform: scale(1.03); }
        94% { opacity: 0.5; }
        100% { opacity: 0; transform: scale(0.97); }
      }

      .particle-field {
        position: absolute;
        inset: 0;
        overflow: hidden;
        opacity: 0;
        animation: field-fade-in 0.4s ease-out 0.2s forwards;
      }

      @keyframes field-fade-in {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }

      .particle {
        position: absolute;
        border-radius: 50%;
        filter: blur(1px);
        pointer-events: none;
        will-change: transform, opacity;
        animation: particle-drift var(--drift-duration, 10s) ease-in-out var(--drift-delay, 0s) infinite;
      }

      @keyframes particle-drift {
        0%, 100% {
          transform: translate(0, 0);
          opacity: calc(var(--target-opacity, 0.15) * 0.4);
        }
        50% {
          transform: translate(var(--sway-amount, 10px), calc(var(--drift-distance, 30px) * -1));
          opacity: var(--target-opacity, 0.15);
        }
      }

      .entrance-stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .entrance-copy {
        width: min(88vw, 1080px);
        text-align: center;
      }

      .title-wrap {
        position: relative;
        display: inline-block;
        opacity: 0;
        transform: scale(0.82) translateY(44px);
        transform-origin: center;
        animation: title-reveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
      }

      @keyframes title-reveal {
        0% {
          opacity: 0;
          transform: scale(0.82) translateY(44px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .title-shadow,
      .title-base,
      .title-scan {
        margin: 0;
        font-family: var(--pa-font-sans);
        font-size: clamp(64px, 10vw, 118px);
        line-height: 0.96;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        transform: skewX(-4deg);
      }

      .title-shadow {
        position: absolute;
        inset: 0;
        color: rgba(203, 230, 255, 0.12);
        filter: blur(28px);
      }

      .title-layer {
        position: relative;
        display: inline-block;
      }

      .title-base {
        position: relative;
        background: linear-gradient(180deg, #fdfeff, #d8e1ec 38%, #69717d);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow:
          0 0 10px rgba(255, 255, 255, 0.06),
          0 0 40px rgba(179, 217, 255, 0.08);
      }

      .title-scan {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.16) 64%,
          rgba(255, 255, 255, 0.92) 72%,
          rgba(217, 238, 255, 0.52) 78%,
          transparent 84%
        );
        background-repeat: no-repeat;
        background-size: 15% 100%;
        background-position: -90% 0;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: brightness(1.08);
        opacity: 0;
        animation: scan-sweep 1.7s cubic-bezier(0.4, 0, 0.2, 1) 1.4s both;
      }

      @keyframes scan-sweep {
        0% {
          background-position: -90% 0;
          background-size: 15% 100%;
          opacity: 0;
        }
        8% { opacity: 1; }
        92% { opacity: 1; }
        100% {
          background-position: 90% 0;
          background-size: 60% 100%;
          opacity: 0;
        }
      }

      .subtitle {
        margin: 0;
        margin-top: 22px;
        font-family: var(--pa-font-sans);
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.56em;
        color: rgba(232, 238, 248, 0.62);
        text-transform: uppercase;
        opacity: 0;
        animation: subtitle-fade 1.5s ease-out 1.4s forwards;
      }

      @keyframes subtitle-fade {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }

      @keyframes stage-fade-out {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .ambient-glow,
        .particle-field,
        .title-wrap,
        .subtitle {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
        .title-scan {
          animation: none !important;
          opacity: 0 !important;
        }
        .entrance-root {
          animation: none !important;
          opacity: 1 !important;
        }
        .particle {
          animation: none !important;
          opacity: 0.1 !important;
        }
      }
    </style>
    <script>
      (function() {
        var particles = document.querySelectorAll('.particle');
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          var x = Math.random() * 100;
          var y = Math.random() * 100;
          var size = 1 + Math.random() * 2;
          var duration = 8 + Math.random() * 7;
          var delay = Math.random() * 5;
          var opacity = 0.08 + Math.random() * 0.12;
          var sway = (Math.random() - 0.5) * 30;
          var drift = 20 + Math.random() * 30;
          var useBlue = Math.random() > 0.6;

          p.style.left = x + '%';
          p.style.top = y + '%';
          p.style.width = (size * 2) + 'px';
          p.style.height = (size * 2) + 'px';
          p.style.setProperty('--drift-duration', duration + 's');
          p.style.setProperty('--drift-delay', delay + 's');
          p.style.setProperty('--target-opacity', opacity);
          p.style.setProperty('--sway-amount', sway + 'px');
          p.style.setProperty('--drift-distance', drift + 'px');
          p.style.background = useBlue ? 'var(--pa-primary-medium)' : '#F3FAFF';
        }

        setTimeout(function() {
          if (typeof window.onEntranceComplete === 'function') {
            window.onEntranceComplete();
          }
        }, 4200);
      })();
    </script>
    <script>lucide.createIcons();</script>
