    <style id="theme-vars">
/* ================================================
   Private Agent UI - Unified Theme Color Palette
   Based on Apple-style design language
   ================================================ */

:root {
  /* ── Brand Primary ── */
  --pa-primary: #007aff;
  --pa-primary-hover: #0066d6;
  --pa-primary-light: rgba(0, 122, 255, 0.08);
  --pa-primary-medium: rgba(0, 122, 255, 0.15);
  --pa-primary-border: rgba(0, 122, 255, 0.25);

  /* ── Semantic State Colors ── */
  --state-success: #34c759;
  --state-warning: #ff9500;
  --state-error: #ff3b30;
  --state-info: #007aff;

  /* ── Backgrounds ── */
  --pa-bg-page: #f5f5f7;
  --pa-bg-surface: #ffffff;
  --pa-bg-elevated: rgba(255, 255, 255, 0.9);
  --pa-bg-hover: #f0f0f5;
  --pa-bg-input: #ffffff;

  /* ── Text ── */
  --pa-text-primary: #1d1d1f;
  --pa-text-secondary: #6e6e73;
  --pa-text-muted: #86868b;
  --pa-text-inverse: #ffffff;

  /* ── Borders & Dividers ── */
  --pa-border: #e5e5ea;
  --pa-border-soft: rgba(0, 0, 0, 0.06);
  --pa-border-strong: rgba(0, 0, 0, 0.1);

  /* ── Shadows ── */
  --pa-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
  --pa-shadow-md: 0 2px 12px rgba(0, 0, 0, 0.06);
  --pa-shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
  --pa-shadow-primary: 0 2px 12px rgba(0, 122, 255, 0.2);

  /* ── Radius ── */
  --pa-radius-sm: 8px;
  --pa-radius-md: 12px;
  --pa-radius-lg: 16px;
  --pa-radius-full: 9999px;

  /* ── Glass / Backdrop ── */
  --pa-glass-bg: rgba(255, 255, 255, 0.85);
  --pa-glass-blur: blur(20px) saturate(180%);
  --pa-glass-border: rgba(0, 0, 0, 0.08);

  /* ── Semantic Aliases (Tailwind compatibility) ── */
  --pa-background: var(--pa-bg-page);
  --pa-foreground: var(--pa-text-primary);
  --pa-card: var(--pa-bg-surface);
  --pa-card-foreground: var(--pa-text-primary);
  --pa-muted: var(--pa-text-muted);
  --pa-muted-foreground: var(--pa-text-secondary);
  --pa-accent: var(--pa-primary-light);
  --pa-accent-foreground: var(--pa-primary);
  --pa-border: var(--pa-border);
  --pa-input: var(--pa-border);
  --pa-ring: var(--pa-primary);

  /* ── Typography ── */
  --pa-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --pa-font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
}

/* ── Typography Classes ── */
.pa-h1 { font-size: 28px; font-weight: 700; line-height: 1.2; letter-spacing: -0.5px; }
.pa-h2 { font-size: 20px; font-weight: 600; line-height: 1.3; }
.pa-h3 { font-size: 16px; font-weight: 600; line-height: 1.4; }
.pa-body { font-size: 14px; font-weight: 400; line-height: 1.6; }
.pa-body-sm { font-size: 13px; font-weight: 400; line-height: 1.5; }
.pa-caption { font-size: 11px; font-weight: 500; line-height: 1.4; }
.pa-label { font-size: 10px; font-weight: 600; line-height: 1.3; letter-spacing: 0.5px; text-transform: uppercase; }

/* ── Dark Mode Overrides ── */
.dark {
  --pa-bg-page: #0f1115;
  --pa-bg-surface: #1c1f26;
  --pa-bg-elevated: rgba(28, 31, 38, 0.9);
  --pa-bg-hover: #252830;
  --pa-bg-input: #1c1f26;

  --pa-text-primary: #f2f3f5;
  --pa-text-secondary: #b6bcc7;
  --pa-text-muted: #6b7280;

  --pa-border: rgba(255, 255, 255, 0.08);
  --pa-border-soft: rgba(255, 255, 255, 0.06);
  --pa-border-strong: rgba(255, 255, 255, 0.12);

  --pa-glass-bg: rgba(28, 31, 38, 0.85);
  --pa-glass-border: rgba(255, 255, 255, 0.08);

  --pa-background: var(--pa-bg-page);
  --pa-foreground: var(--pa-text-primary);
  --pa-card: var(--pa-bg-surface);
  --pa-card-foreground: var(--pa-text-primary);
  --pa-muted: var(--pa-text-muted);
  --pa-muted-foreground: var(--pa-text-secondary);
  --pa-accent: var(--pa-primary-light);
  --pa-accent-foreground: var(--pa-primary);
  --pa-input: var(--pa-border);
  --pa-ring: var(--pa-primary);

  --pa-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
  --pa-shadow-md: 0 2px 12px rgba(0, 0, 0, 0.4);
  --pa-shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
}

    <style>
      /* === Body background === */
      body { background: var(--pa-bg-page); font-family: var(--pa-font-sans); }

      /* === Page Layout === */
      .pc-page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 48px 40px;
      }

      /* === Page Header === */
      .pc-page-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 48px;
      }
      .pc-header-icon {
        width: 48px; height: 48px;
        border-radius: var(--pa-radius-md);
        background: var(--pa-primary);
        color: white;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }
      .pc-page-title {
        font-size: 28px; font-weight: 700;
        color: var(--pa-text-primary);
        line-height: 1.2; margin: 0;
      }
      .pc-page-subtitle {
        font-size: 14px;
        color: var(--pa-text-secondary);
        margin: 4px 0 0 0; line-height: 1.5;
      }

      /* === Preview Grid === */
      .pc-grid {
        display: flex; gap: 40px;
        flex-wrap: wrap; justify-content: center;
      }
      .pc-section { flex: 0 0 auto; }
      .pc-section-head { margin-bottom: 16px; }
      .pc-section-label {
        display: block; font-size: 16px; font-weight: 600;
        color: var(--pa-text-primary); line-height: 1.4;
      }
      .pc-section-desc {
        display: block; font-size: 12px;
        color: var(--pa-text-muted); margin-top: 4px; line-height: 1.4;
      }

      /* === Dark Backdrop Card === */
      .pc-backdrop {
        background: linear-gradient(145deg, #1a1a2e, #16213e);
        border-radius: 20px;
        padding: 36px 32px;
        display: flex; align-items: center; justify-content: center;
        min-height: 300px;
      }

      /* === Window Common === */
      .pc-window {
        position: relative;
        font-family: var(--pa-font-sans);
      }

      /* === Agent Avatar System (Blue gradient) === */
      .pc-avatar-wrap {
        position: relative;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }
      .pc-glow {
        position: absolute; top: 0; left: 0;
        pointer-events: none;
      }
      .pc-avatar {
        position: relative; z-index: 1;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at 30% 30%, #4a9eff, #007aff);
        box-shadow: inset 0 1px 3px rgba(255,255,255,0.3), 0 2px 8px rgba(0,122,255,0.3);
      }

      /* Avatar — Small (Incoming, 44px circle) */
      .pc-avatar-wrap--sm { width: 44px; height: 44px; }
      .pc-avatar--sm {
        width: 44px; height: 44px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.9);
      }
      .pc-glow--incoming {
        width: 44px; height: 44px;
        border-radius: 50%;
        background: rgba(0, 122, 255, 0.3);
        animation: pc-breathe-incoming 1.8s ease-in-out infinite;
      }
      @keyframes pc-breathe-incoming {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.12); opacity: 0.15; }
      }

      /* Avatar — Medium (Outgoing, 80px circle) */
      .pc-avatar-wrap--md { width: 80px; height: 80px; }
      .pc-avatar--md {
        width: 80px; height: 80px;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.9);
      }
      .pc-glow--outgoing {
        width: 80px; height: 80px;
        border-radius: 50%;
        background: rgba(0, 122, 255, 0.25);
        animation: pc-breathe-outgoing 3.6s ease-in-out infinite;
      }
      @keyframes pc-breathe-outgoing {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.12); opacity: 0.2; }
      }

      /* Avatar — Large (Connected, 96px rounded square) */
      .pc-avatar-wrap--lg { width: 96px; height: 96px; }
      .pc-avatar--lg {
        width: 96px; height: 96px;
        border-radius: 20px;
        border: 3px solid rgba(255,255,255,0.9);
      }
      .pc-glow--call {
        width: 96px; height: 96px;
        border-radius: 20px;
        background: rgba(0, 122, 255, 0.25);
        animation: pc-breathe-call 1.8s ease-in-out infinite;
      }
      @keyframes pc-breathe-call {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.12); opacity: 0.1; }
      }

      /* === Text Tokens === */
      .pc-name { font-size: 18px; font-weight: 600; color: var(--pa-text-primary); }
      .pc-name--sm { font-size: 13px; font-weight: 600; color: var(--pa-text-primary); }
      .pc-status { font-size: 14px; color: var(--pa-text-secondary); display: flex; align-items: center; gap: 6px; }
      .pc-status--sm { font-size: 11px; color: var(--pa-text-muted); }

      /* Calling dots animation */
      .pc-dots { display: inline-flex; gap: 3px; }
      .pc-dots span {
        width: 4px; height: 4px;
        border-radius: 50%;
        background: var(--pa-primary);
        animation: pc-dot-bounce 1.4s ease-in-out infinite;
      }
      .pc-dots span:nth-child(2) { animation-delay: 0.2s; }
      .pc-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes pc-dot-bounce {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }

      /* === Incoming Call Window — softer shadow === */
      .pc-window--incoming {
        width: 300px; height: 88px;
        border-radius: 16px;
        background: var(--pa-bg-surface);
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.03);
        display: flex; flex-direction: row; align-items: center;
        padding: 0 14px; gap: 12px;
        border: 1px solid var(--pa-border-soft);
      }
      .pc-info {
        flex: 1; min-width: 0;
        display: flex; flex-direction: column; gap: 2px;
      }
      .pc-actions {
        display: flex; gap: 8px; flex-shrink: 0;
      }

      /* Pill Buttons (Incoming) — icon-only round */
      .pc-pill {
        width: 36px; height: 36px;
        border-radius: 50%;
        border: none; cursor: pointer;
        color: #FFFFFF;
        display: flex; align-items: center; justify-content: center;
        transition: filter 140ms cubic-bezier(.2,.8,.2,1), transform 120ms cubic-bezier(.2,.8,.2,1);
      }
      .pc-pill--accept {
        background: var(--state-success);
        animation: pc-pulse-accept 2s ease-in-out infinite;
      }
      .pc-pill--reject {
        background: var(--state-error);
      }
      .pc-pill--accept:hover, .pc-pill--reject:hover { filter: brightness(0.92); }
      .pc-pill:active { transform: scale(0.92); }
      .pc-pill:focus-visible { outline: 2px solid var(--pa-primary); outline-offset: 2px; }
      @keyframes pc-pulse-accept {
        0%, 100% { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.2); }
        50% { box-shadow: 0 0 0 6px rgba(52, 199, 89, 0.12); }
      }

      /* === Accent Bar — Blue === */
      .pc-accent-bar {
        height: 4px;
        background: linear-gradient(90deg, var(--pa-primary), #4a9eff);
        border-radius: 20px 20px 0 0;
        flex-shrink: 0;
      }

      /* === Window Body === */
      .pc-window-body {
        flex: 1;
        display: flex; flex-direction: column; align-items: center;
      }

      /* === Unified Call Window (Outgoing + Connected) === */
      .pc-window--call {
        width: 384px; height: 320px;
        border-radius: 20px;
        background: var(--pa-bg-surface);
        border: 1px solid var(--pa-border-soft);
        display: flex; flex-direction: column;
        overflow: hidden;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.03);
      }
      .pc-window-body--call { padding: 24px; }

      .pc-call-top {
        flex: 1;
        display: flex; flex-direction: column; align-items: center;
        padding-top: 12px;
      }

      /* Call name */
      .pc-name--call { margin-top: 14px; }

      /* State toggle: calling vs connected */
      .pc-state-calling, .pc-state-connected {
        display: flex; align-items: center; gap: 6px;
        margin-top: 6px;
        transition: opacity 0.3s ease;
      }
      .pc-state-calling.hidden, .pc-state-connected.hidden {
        display: none;
      }

      /* Timer row */
      .pc-timer-row {
        display: flex; align-items: center; gap: 6px;
      }
      .pc-live-dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--state-success);
        animation: pc-live-pulse 2s ease-in-out infinite;
      }
      @keyframes pc-live-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .pc-timer {
        font-size: 14px; color: var(--pa-text-secondary);
        font-variant-numeric: tabular-nums;
      }

      .pc-bottom-actions {
        display: flex; gap: 10px;
        margin-top: 16px;
        justify-content: center;
      }

      /* === Buttons (Outgoing / Connected) === */
      .pc-btn {
        height: 40px;
        border-radius: 12px;
        border: none; cursor: pointer;
        font-size: 13px; font-weight: 600;
        display: flex; align-items: center; justify-content: center;
        gap: 6px;
        font-family: var(--pa-font-sans);
        transition: filter 140ms cubic-bezier(.2,.8,.2,1),
                    background-color 160ms cubic-bezier(.2,.8,.2,1),
                    color 160ms cubic-bezier(.2,.8,.2,1),
                    transform 120ms cubic-bezier(.2,.8,.2,1);
        padding: 0 16px;
      }
      .pc-btn--w112 { width: 112px; }
      .pc-btn--hangup {
        background: var(--state-error);
        color: #FFFFFF;
      }
      .pc-btn--hangup:hover { filter: brightness(0.92); }
      .pc-btn--neutral {
        background: var(--pa-bg-hover);
        color: var(--pa-text-secondary);
        font-weight: 500;
      }
      .pc-btn--neutral:hover { background: var(--pa-border); color: var(--pa-text-primary); }
      .pc-btn--neutral.pc-active {
        background: var(--pa-primary);
        color: #FFFFFF;
        font-weight: 600;
      }
      .pc-btn:active { transform: scale(0.96); }
      .pc-btn:focus-visible { outline: 2px solid var(--pa-primary); outline-offset: 2px; }

      /* === Footer === */
      .pc-footer {
        margin-top: 60px;
        padding-top: 24px;
        border-top: 1px solid var(--pa-border);
        text-align: center;
        font-size: 12px;
        color: var(--pa-text-muted);
        display: flex; align-items: center; justify-content: center; gap: 8px;
      }
      .pc-footer-sep { color: var(--pa-border); }

      /* === Responsive === */
      @media (max-width: 768px) {
        .pc-page { padding: 32px 20px; }
        .pc-grid { gap: 24px; }
        .pc-backdrop { padding: 24px 16px; }
      }

      /* === Reduced Motion === */
      @media (prefers-reduced-motion: reduce) {
        .pc-glow--incoming, .pc-glow--call,
        .pc-pill--accept, .pc-dots span, .pc-live-dot {
          animation: none;
        }
        .pc-pill, .pc-btn { transition: none; }
      }
    </style>
    <script>
      (function () {
        var callSeconds = 0;
        var timerInterval = null;
        var timerEl = document.getElementById('callTimer');
        var stateCalling = document.getElementById('stateCalling');
        var stateConnected = document.getElementById('stateConnected');
        var callGlow = document.getElementById('callGlow');
        var connectedTimer = null;

        function formatTime(sec) {
          var m = String(Math.floor(sec / 60)).padStart(2, '0');
          var s = String(sec % 60).padStart(2, '0');
          return m + ':' + s;
        }

        function updateDisplay() {
          if (timerEl) timerEl.textContent = formatTime(callSeconds);
        }

        function showCallingState() {
          if (stateCalling) stateCalling.classList.remove('hidden');
          if (stateConnected) stateConnected.classList.add('hidden');
          if (callGlow) callGlow.style.animationDuration = '3.6s';
        }

        function showConnectedState() {
          if (stateCalling) stateCalling.classList.add('hidden');
          if (stateConnected) stateConnected.classList.remove('hidden');
          if (callGlow) callGlow.style.animationDuration = '1.8s';
          startTimer();
        }

        function startTimer() {
          if (timerInterval) return;
          callSeconds = 0;
          updateDisplay();
          timerInterval = setInterval(function () {
            callSeconds++;
            updateDisplay();
          }, 1000);
        }

        function stopTimer() {
          if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
          }
          callSeconds = 0;
          updateDisplay();
        }

        function resetToCalling() {
          stopTimer();
          if (connectedTimer) {
            clearTimeout(connectedTimer);
            connectedTimer = null;
          }
          showCallingState();
          // Auto-switch to connected after 3s
          connectedTimer = setTimeout(function () {
            showConnectedState();
          }, 3000);
        }

        var muteBtn = document.getElementById('muteBtn');
        if (muteBtn) {
          muteBtn.addEventListener('click', function () {
            muteBtn.classList.toggle('pc-active');
          });
        }

        var speakerBtn = document.getElementById('speakerBtn');
        if (speakerBtn) {
          speakerBtn.addEventListener('click', function () {
            speakerBtn.classList.toggle('pc-active');
          });
        }

        var hangupBtn = document.getElementById('hangupBtn');
        if (hangupBtn) {
          hangupBtn.addEventListener('click', function () {
            if (muteBtn) muteBtn.classList.remove('pc-active');
            if (speakerBtn) speakerBtn.classList.remove('pc-active');
            resetToCalling();
          });
        }

        // Start in calling state, auto-transition to connected
        resetToCalling();
      })();
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
