/* ================================================
   Private Agent UI - Unified Theme Color Palette
   Based on Apple-style design language
   ================================================ */

:root {
  /* ── Brand Primary ── */
  --pa-primary: #007aff;
  --pa-primary-hover: #0066d6;
  --pa-primary-light: rgba(0, 122, 255, 0.08);
  --pa-primary-medium: rgba(0, 122, 255, 0.15);
  --pa-primary-border: rgba(0, 122, 255, 0.25);

  /* ── Semantic State Colors ── */
  --state-success: #34c759;
  --state-warning: #ff9500;
  --state-error: #ff3b30;
  --state-info: #007aff;

  /* ── Backgrounds ── */
  --pa-bg-page: #f5f5f7;
  --pa-bg-surface: #ffffff;
  --pa-bg-elevated: rgba(255, 255, 255, 0.9);
  --pa-bg-hover: #f0f0f5;
  --pa-bg-input: #ffffff;

  /* ── Text ── */
  --pa-text-primary: #1d1d1f;
  --pa-text-secondary: #6e6e73;
  --pa-text-muted: #86868b;
  --pa-text-inverse: #ffffff;

  /* ── Borders & Dividers ── */
  --pa-border: #e5e5ea;
  --pa-border-soft: rgba(0, 0, 0, 0.06);
  --pa-border-strong: rgba(0, 0, 0, 0.1);

  /* ── Shadows ── */
  --pa-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
  --pa-shadow-md: 0 2px 12px rgba(0, 0, 0, 0.06);
  --pa-shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
  --pa-shadow-primary: 0 2px 12px rgba(0, 122, 255, 0.2);

  /* ── Radius ── */
  --pa-radius-sm: 8px;
  --pa-radius-md: 12px;
  --pa-radius-lg: 16px;
  --pa-radius-full: 9999px;

  /* ── Glass / Backdrop ── */
  --pa-glass-bg: rgba(255, 255, 255, 0.85);
  --pa-glass-blur: blur(20px) saturate(180%);
  --pa-glass-border: rgba(0, 0, 0, 0.08);

  /* ── Typography ── */
  --pa-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --pa-font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
}

/* ── Typography Classes ── */
.pa-h1 { font-size: 28px; font-weight: 700; line-height: 1.2; letter-spacing: -0.5px; }
.pa-h2 { font-size: 20px; font-weight: 600; line-height: 1.3; }
.pa-h3 { font-size: 16px; font-weight: 600; line-height: 1.4; }
.pa-body { font-size: 14px; font-weight: 400; line-height: 1.6; }
.pa-body-sm { font-size: 13px; font-weight: 400; line-height: 1.5; }
.pa-caption { font-size: 11px; font-weight: 500; line-height: 1.4; }
.pa-label { font-size: 10px; font-weight: 600; line-height: 1.3; letter-spacing: 0.5px; text-transform: uppercase; }

/* ── Dark Mode Overrides ── */
.dark {
  --pa-bg-page: #0f1115;
  --pa-bg-surface: #1c1f26;
  --pa-bg-elevated: rgba(28, 31, 38, 0.9);
  --pa-bg-hover: #252830;
  --pa-bg-input: #1c1f26;

  --pa-text-primary: #f2f3f5;
  --pa-text-secondary: #b6bcc7;
  --pa-text-muted: #6b7280;

  --pa-border: rgba(255, 255, 255, 0.08);
  --pa-border-soft: rgba(255, 255, 255, 0.06);
  --pa-border-strong: rgba(255, 255, 255, 0.12);

  --pa-glass-bg: rgba(28, 31, 38, 0.85);
  --pa-glass-border: rgba(255, 255, 255, 0.08);

  --pa-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
  --pa-shadow-md: 0 2px 12px rgba(0, 0, 0, 0.4);
  --pa-shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
}

    <script>
      (function () {
        const canvas = document.getElementById('wave-canvas');
        const inputWrapper = document.getElementById('input-wrapper');
        const sendBtn = document.getElementById('send-btn');
        const statusEl = document.getElementById('ti-status');
        const statusTextEl = document.getElementById('status-text');
        const toggleBtn = document.getElementById('toggle-btn');
        const intensitySlider = document.getElementById('intensity');
        const intensityValue = document.getElementById('intensity-value');

        const ctx = canvas.getContext('2d');
        let dpr = window.devicePixelRatio || 1;

        function resizeCanvas() {
          const rect = inputWrapper.getBoundingClientRect();
          const w = rect.width + 4;
          const h = rect.height + 4;
          canvas.width = w * dpr;
          canvas.height = h * dpr;
          canvas.style.width = w + 'px';
          canvas.style.height = h + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          engine.w = w;
          engine.h = h;
        }

        // Sequential status text — NOT random
        const statusTexts = ['正在思考', '理解意图', '检索信息', '推理中', '组织答案', '构建响应'];
        let statusIndex = 0;
        let lastStatusSwitch = 0;

        const engine = {
          w: 0, h: 0,
          r: 16,
          intensity: 5,
          active: false,
          startTime: 0,
          rafId: null,
          primaryWaves: [],
          detailWaves: [],
          breathSpeed: 0.15 + Math.random() * 0.15,
          bursts: [],
          particles: [],
          lastBurstTime: 0,

          initWaves() {
            this.primaryWaves = [];
            for (let i = 0; i < 3; i++) {
              this.primaryWaves.push({
                freq: 0.008 + Math.random() * 0.012,
                amp: 2 + Math.random() * 4,
                speed: 0.6 + Math.random() * 1.2,
                phase: Math.random() * Math.PI * 2
              });
            }
            this.detailWaves = [];
            for (let i = 0; i < 5; i++) {
              this.detailWaves.push({
                freq: 0.06 + Math.random() * 0.10,
                amp: 0.3 + Math.random() * 0.8,
                speed: 1.0 + Math.random() * 2.5,
                phase: Math.random() * Math.PI * 2
              });
            }
            this.initParticles();
          },

          initParticles() {
            const count = 2 + Math.floor(this.intensity / 2.5);
            this.particles = [];
            for (let i = 0; i < count; i++) {
              this.particles.push({
                pos: Math.random(),
                speed: 0.03 + Math.random() * 0.05,
                size: 1.5 + Math.random() * 2.0
              });
            }
          },

          getWaveOffset(t, perimeterPos) {
            let val = 0;
            for (const w of this.primaryWaves) {
              val += Math.sin(perimeterPos * w.freq * 100 + w.phase + t * w.speed) * w.amp;
            }
            for (const w of this.detailWaves) {
              val += Math.sin(perimeterPos * w.freq * 100 + w.phase + t * w.speed) * w.amp;
            }
            // Burst contributions
            for (const b of this.bursts) {
              const age = t - b.birthTime;
              const lifeFrac = age / b.life;
              if (lifeFrac < 0 || lifeFrac > 1) continue;
              let envelope;
              if (lifeFrac < 0.15) {
                envelope = lifeFrac / 0.15;
              } else {
                const decayFrac = (lifeFrac - 0.15) / 0.85;
                envelope = 1 - decayFrac * decayFrac;
              }
              const dist = Math.abs(perimeterPos - b.position);
              const wrapped = Math.min(dist, 1 - dist);
              const gauss = Math.exp(-(wrapped * wrapped) / (2 * b.sigma * b.sigma));
              val += b.amplitude * envelope * gauss;
            }
            return val;
          },

          maybeSpawnBurst(t) {
            const interval = 3.0 / (this.intensity / 5);
            if (t - this.lastBurstTime > interval) {
              this.bursts.push({
                position: 0.15 + Math.random() * 0.70,
                amplitude: 4 + Math.random() * 8,
                sigma: 0.04 + Math.random() * 0.06,
                life: 1.0 + Math.random() * 1.5,
                birthTime: t
              });
              this.lastBurstTime = t;
            }
            // Clean up dead bursts
            this.bursts = this.bursts.filter(b => (t - b.birthTime) < b.life);
          },

          getPathPoints(t) {
            const w = this.w;
            const h = this.h;
            const r = this.r;
            const perimeter = 2 * (w + h);
            const points = [];
            const segments = Math.max(60, Math.floor(perimeter / 4));

            for (let i = 0; i <= segments; i++) {
              const frac = i / segments;
              const p = frac * perimeter;
              let x, y;
              // Determine which edge
              if (p < w) {
                x = p; y = 0;
              } else if (p < w + h) {
                x = w; y = p - w;
              } else if (p < 2 * w + h) {
                x = w - (p - w - h); y = h;
              } else {
                x = 0; y = h - (p - 2 * w - h);
              }
              // Apply wave offset (outward normal)
              const offset = this.getWaveOffset(t, frac);
              let nx = 0, ny = 0;
              if (y <= 0.1 && x > r && x < w - r) { ny = -1; }
              else if (x >= w - 0.1 && y > r && y < h - r) { nx = 1; }
              else if (y >= h - 0.1 && x > r && x < w - r) { ny = 1; }
              else if (x <= 0.1 && y > r && y < h - r) { nx = -1; }
              else {
                // Corner region — approximate normal
                const cx = x < r ? r : (x > w - r ? w - r : x);
                const cy = y < r ? r : (y > h - r ? h - r : y);
                const dx = x - cx;
                const dy = y - cy;
                const len = Math.sqrt(dx * dx + dy * dy) || 1;
                nx = dx / len;
                ny = dy / len;
              }
              points.push({ x: x + nx * offset, y: y + ny * offset });
            }
            return points;
          },

          draw(t) {
            ctx.clearRect(0, 0, this.w, this.h);

            const breath = 0.4 + 0.3 * (1 + Math.sin(t * this.breathSpeed * 2 * Math.PI)) / 2;
            const points = this.getPathPoints(t);
            if (points.length < 2) return;

            // Layer 1: Outer glow
            const blurAmount = 6 + this.intensity * 4;
            const glowWidth = 8 + this.intensity * 4;
            ctx.save();
            ctx.filter = 'blur(' + blurAmount + 'px)';
            ctx.strokeStyle = 'rgba(0, 122, 255, ' + (0.15 * breath) + ')';
            ctx.lineWidth = glowWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
              ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.restore();

            // Layer 2: Main wave border
            const gradient = ctx.createLinearGradient(0, 0, this.w, this.h);
            gradient.addColorStop(0, 'rgba(0, 122, 255, ' + (0.5 * breath + 0.2) + ')');
            gradient.addColorStop(0.5, 'rgba(0, 122, 255, ' + (0.7 * breath + 0.2) + ')');
            gradient.addColorStop(1, 'rgba(0, 122, 255, ' + (0.5 * breath + 0.2) + ')');
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
              ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.closePath();
            ctx.stroke();

            // Layer 3: Peak glow particles
            for (const p of this.particles) {
              p.pos += p.speed * 0.01;
              if (p.pos > 1) p.pos -= 1;
              const offset = this.getWaveOffset(t, p.pos);
              const intensity = Math.min(1, Math.abs(offset) / 6);
              const w = this.w, h = this.h;
              const perimeter = 2 * (w + h);
              const dist = p.pos * perimeter;
              let px, py;
              if (dist < w) { px = dist; py = 0; }
              else if (dist < w + h) { px = w; py = dist - w; }
              else if (dist < 2 * w + h) { px = w - (dist - w - h); py = h; }
              else { px = 0; py = h - (dist - 2 * w - h); }

              const grad = ctx.createRadialGradient(px, py, 0, px, py, p.size * 4);
              grad.addColorStop(0, 'rgba(120, 210, 255, ' + (0.6 * (0.3 + intensity * 0.7)) + ')');
              grad.addColorStop(0.5, 'rgba(0, 122, 255, ' + (0.2 * (0.3 + intensity * 0.7)) + ')');
              grad.addColorStop(1, 'rgba(0, 122, 255, 0)');
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.arc(px, py, p.size * 4, 0, Math.PI * 2);
              ctx.fill();
            }

            // Send button pulse
            const btnPulse = 0.5 + 0.5 * Math.sin(t * 1.5);
            const intensityFactor = this.intensity / 5;
            const glowSize = 6 + btnPulse * 14 * intensityFactor;
            const glowAlpha = 0.15 + btnPulse * 0.2;
            sendBtn.style.boxShadow = '0 0 ' + glowSize + 'px rgba(0, 122, 255, ' + glowAlpha + ')';
          },

          updateStatus(t) {
            if (t - lastStatusSwitch > 2.5) {
              statusIndex = (statusIndex + 1) % statusTexts.length;
              statusTextEl.textContent = statusTexts[statusIndex];
              lastStatusSwitch = t;
            }
          },

          animate() {
            if (!this.active) return;
            const t = (performance.now() - this.startTime) / 1000;
            this.maybeSpawnBurst(t);
            this.draw(t);
            this.updateStatus(t);
            this.rafId = requestAnimationFrame(() => this.animate());
          },

          start() {
            this.active = true;
            this.startTime = performance.now();
            this.lastBurstTime = 0;
            lastStatusSwitch = 0;
            statusIndex = 0;
            statusTextEl.textContent = statusTexts[0];
            this.animate();
          },

          stop() {
            this.active = false;
            if (this.rafId) cancelAnimationFrame(this.rafId);
            this.rafId = null;
            this.bursts = [];
            sendBtn.style.boxShadow = '';
          },

          setIntensity(v) {
            this.intensity = v;
            this.initParticles();
          }
        };

        engine.initWaves();
        resizeCanvas();

        let resizeTimer;
        window.addEventListener('resize', function () {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function () {
            dpr = window.devicePixelRatio || 1;
            resizeCanvas();
          }, 150);
        });

        toggleBtn.addEventListener('click', function () {
          const isActive = toggleBtn.classList.toggle('active');
          if (isActive) {
            toggleBtn.textContent = '关闭意识流';
            canvas.classList.add('active');
            inputWrapper.classList.add('thinking');
            statusEl.classList.add('active');
            engine.start();
          } else {
            toggleBtn.textContent = '激活意识流';
            canvas.classList.remove('active');
            inputWrapper.classList.remove('thinking');
            statusEl.classList.remove('active');
            engine.stop();
          }
        });

        intensitySlider.addEventListener('input', function () {
          const v = parseInt(this.value, 10);
          intensityValue.textContent = v;
          engine.setIntensity(v);
        });

        lucide.createIcons();
      })();
    </script>
</body>
</html>
