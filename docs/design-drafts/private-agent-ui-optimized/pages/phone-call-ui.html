<!DOCTYPE html>
<html lang="zh-CN" class="light">

    <style id="theme-vars">
/**
 * Private Agent UI — Black & White Theme
 * Apple-style monochrome palette with crisp typography and generous radius.
 */

:root {
  /* ── Radius ── */
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --radius-full: 9999px;

  /* ── Spacing ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* ── Typography ── */
  --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', 'SFMono-Regular', 'Fira Code', Consolas, monospace;

  /* ── Backgrounds ── */
  --background: #f5f5f7;
  --foreground: #1d1d1f;

  --card: #ffffff;
  --card-foreground: #1d1d1f;

  --popover: #ffffff;
  --popover-foreground: #1d1d1f;

  --muted: #86868b;
  --muted-foreground: #6e6e73;

  --accent: #f2f2f7;
  --accent-foreground: #1d1d1f;

  --border: #e5e5ea;
  --input: #d1d1d6;
  --ring: #1d1d1f;

  /* ── Primary (black on white) ── */
  --primary: #000000;
  --primary-foreground: #ffffff;
  --primary-hover: #1d1d1f;
  --primary-soft: rgba(0, 0, 0, 0.06);

  /* ── Secondary ── */
  --secondary: #f2f2f7;
  --secondary-foreground: #1d1d1f;

  /* ── Semantic states ── */
  --destructive: #ff3b30;
  --destructive-foreground: #ffffff;
  --success: #34c759;
  --success-foreground: #ffffff;
  --warning: #ff9500;

  /* ── Surfaces ── */
  --surface-elevated: #ffffff;
  --surface-hover: #f2f2f7;
  --surface-pressed: #e5e5ea;

  /* ── Shadows ── */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
  --shadow-xl: 0 24px 80px rgba(0, 0, 0, 0.16);

  /* ── Apple-style blur / glass ── */
  --backdrop-blur: blur(20px) saturate(180%);
}

.dark {
  --background: #000000;
  --foreground: #ffffff;

  --card: #1c1c1e;
  --card-foreground: #ffffff;

  --popover: #1c1c1e;
  --popover-foreground: #ffffff;

  --muted: #8e8e93;
  --muted-foreground: #aeaeb2;

  --accent: #2c2c2e;
  --accent-foreground: #ffffff;

  --border: #38383a;
  --input: #48484a;
  --ring: #ffffff;

  --primary: #ffffff;
  --primary-foreground: #000000;
  --primary-hover: #f2f2f7;
  --primary-soft: rgba(255, 255, 255, 0.1);

  --secondary: #2c2c2e;
  --secondary-foreground: #ffffff;

  --destructive: #ff453a;
  --success: #30d158;

  --surface-elevated: #1c1c1e;
  --surface-hover: #2c2c2e;
  --surface-pressed: #3a3a3c;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.24);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.32);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.4);
  --shadow-xl: 0 24px 80px rgba(0, 0, 0, 0.48);
}

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;

</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen w-full flex flex-col items-center justify-center gap-8 bg-background px-6 py-10">
      <!-- 来电提示窗（Compact bar） -->
      <section id="incomingCall" class="w-full max-w-md bg-card rounded-[var(--radius-xl)] shadow-lg p-4 flex items-center gap-4 transition-all duration-300 ease-out">
        <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary flex-shrink-0">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div class="flex-1 min-w-0 text-left">
          <p class="text-base font-semibold text-card-foreground truncate">妈妈</p>
          <p class="text-sm text-muted-foreground">iPhone</p>
        </div>
        <div class="flex items-center gap-3 flex-shrink-0">
          <button type="button" aria-label="拒接" class="decline-btn w-11 h-11 rounded-full bg-destructive text-destructive-foreground flex items-center justify-center shadow-md hover:brightness-110 active:scale-95 transition-all duration-150">
            <i data-lucide="phone-off" class="w-5 h-5"></i>
          </button>
          <button id="answerBtn" type="button" aria-label="接听" class="w-11 h-11 rounded-full bg-success text-success-foreground flex items-center justify-center shadow-md hover:brightness-110 active:scale-95 transition-all duration-150">
            <i data-lucide="phone" class="w-5 h-5"></i>
          </button>
        </div>
      </section>

      <!-- 通话窗口（Centered card） -->
      <section id="unifiedCall" class="hidden w-full max-w-sm bg-card rounded-[var(--radius-xl)] shadow-xl px-8 pt-10 pb-8 flex-col items-center text-center transition-all duration-300 ease-out">
        <div class="mb-8">
          <h2 class="text-[28px] leading-tight font-semibold text-card-foreground tracking-tight">妈妈</h2>
          <p id="callingState" class="mt-2 text-base text-muted-foreground">正在呼叫…</p>
          <p id="connectedState" class="hidden mt-2 text-base text-muted-foreground font-mono">通话中 <span id="callTimer">00:00</span></p>
        </div>

        <!-- 中央电话图标 + 呼吸光环 -->
        <div class="relative flex items-center justify-center w-40 h-40 mb-10">
          <span class="absolute inset-0 rounded-full bg-primary/5 animate-ping-slow" aria-hidden="true"></span>
          <span class="absolute inset-4 rounded-full bg-primary/10 animate-ping-slow delay-150" aria-hidden="true"></span>
          <span class="absolute inset-8 rounded-full bg-primary/15 animate-ping-slow delay-300" aria-hidden="true"></span>
          <div class="relative z-10 w-24 h-24 rounded-full bg-primary text-primary-foreground flex items-center justify-center shadow-md">
            <svg class="w-11 h-11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </div>
        </div>

        <!-- 控制按钮 -->
        <div class="grid grid-cols-3 gap-6 w-full">
          <button id="muteBtn" type="button" class="call-action group flex flex-col items-center gap-2" aria-pressed="false">
            <span class="action-surface w-16 h-16 rounded-full bg-secondary text-secondary-foreground flex items-center justify-center shadow-sm active:scale-95 transition-all duration-150">
              <i data-lucide="mic" class="w-7 h-7"></i>
            </span>
            <span class="text-xs text-muted-foreground">静音</span>
          </button>

          <button id="hangupBtn" type="button" class="group flex flex-col items-center gap-2">
            <span class="w-16 h-16 rounded-full bg-destructive text-destructive-foreground flex items-center justify-center shadow-md active:scale-95 transition-all duration-150">
              <i data-lucide="phone-off" class="w-7 h-7"></i>
            </span>
            <span class="text-xs text-muted-foreground">挂断</span>
          </button>

          <button id="speakerBtn" type="button" class="call-action group flex flex-col items-center gap-2" aria-pressed="false">
            <span class="action-surface w-16 h-16 rounded-full bg-secondary text-secondary-foreground flex items-center justify-center shadow-sm active:scale-95 transition-all duration-150">
              <i data-lucide="volume-2" class="w-7 h-7"></i>
            </span>
            <span class="text-xs text-muted-foreground">免提</span>
          </button>
        </div>
      </section>
    </main>

    <style>
      body {
        font-family: var(--font-sans);
      }

      .call-action.active .action-surface {
        background-color: var(--foreground);
        color: var(--primary-foreground);
      }

      @keyframes pulse-ring {
        0% {
          transform: scale(1);
          opacity: 0.35;
        }
        100% {
          transform: scale(1.55);
          opacity: 0;
        }
      }

      .animate-ping-slow {
        animation: pulse-ring 2.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        will-change: transform, opacity;
      }

      .delay-150 {
        animation-delay: 0.15s;
      }

      .delay-300 {
        animation-delay: 0.3s;
      }
    </style>

    <script>
      (function () {
        const $ = (id) => document.getElementById(id);
        let connectTimer = null;
        let tickTimer = null;
        let seconds = 0;

        function formatTime(totalSeconds) {
          const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
          const s = (totalSeconds % 60).toString().padStart(2, '0');
          return m + ':' + s;
        }

        function resetCall() {
          clearTimeout(connectTimer);
          clearInterval(tickTimer);
          connectTimer = null;
          tickTimer = null;
          seconds = 0;

          $('callTimer').textContent = '00:00';
          $('callingState').classList.remove('hidden');
          $('connectedState').classList.add('hidden');
          $('unifiedCall').classList.add('hidden');
          $('incomingCall').classList.remove('hidden');

          lucide.createIcons();
        }

        function startCall() {
          $('incomingCall').classList.add('hidden');
          $('unifiedCall').classList.remove('hidden');
          $('unifiedCall').classList.add('flex');
          $('callingState').classList.remove('hidden');
          $('connectedState').classList.add('hidden');
          $('callTimer').textContent = '00:00';

          connectTimer = setTimeout(function () {
            $('callingState').classList.add('hidden');
            $('connectedState').classList.remove('hidden');
            tickTimer = setInterval(function () {
              seconds += 1;
              $('callTimer').textContent = formatTime(seconds);
            }, 1000);
          }, 3000);
        }

        function toggleAction(btn) {
          const pressed = btn.getAttribute('aria-pressed') === 'true';
          btn.setAttribute('aria-pressed', String(!pressed));
          btn.classList.toggle('active');
        }

        $('answerBtn').addEventListener('click', startCall);
        $('hangupBtn').addEventListener('click', resetCall);
        document.querySelector('.decline-btn').addEventListener('click', resetCall);
        $('muteBtn').addEventListener('click', function () { toggleAction($('muteBtn')); });
        $('speakerBtn').addEventListener('click', function () { toggleAction($('speakerBtn')); });

        lucide.createIcons();
      })();
    </script>
</body>
</html>
