    <style id="theme-vars">
/**
 * Private Agent UI — Black & White Theme
 * Apple-style monochrome palette with crisp typography and generous radius.
 */

:root {
  /* ── Radius ── */
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --radius-full: 9999px;

  /* ── Spacing ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* ── Typography ── */
  --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', 'SFMono-Regular', 'Fira Code', Consolas, monospace;

  /* ── Backgrounds ── */
  --background: #f5f5f7;
  --foreground: #1d1d1f;

  --card: #ffffff;
  --card-foreground: #1d1d1f;

  --popover: #ffffff;
  --popover-foreground: #1d1d1f;

  --muted: #86868b;
  --muted-foreground: #6e6e73;

  --accent: #f2f2f7;
  --accent-foreground: #1d1d1f;

  --border: #e5e5ea;
  --input: #d1d1d6;
  --ring: #1d1d1f;

  /* ── Primary (black on white) ── */
  --primary: #000000;
  --primary-foreground: #ffffff;
  --primary-hover: #1d1d1f;
  --primary-soft: rgba(0, 0, 0, 0.06);

  /* ── Secondary ── */
  --secondary: #f2f2f7;
  --secondary-foreground: #1d1d1f;

  /* ── Semantic states ── */
  --destructive: #ff3b30;
  --destructive-foreground: #ffffff;
  --success: #34c759;
  --success-foreground: #ffffff;
  --warning: #ff9500;

  /* ── Surfaces ── */
  --surface-elevated: #ffffff;
  --surface-hover: #f2f2f7;
  --surface-pressed: #e5e5ea;

  /* ── Shadows ── */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
  --shadow-xl: 0 24px 80px rgba(0, 0, 0, 0.16);

  /* ── Apple-style blur / glass ── */
  --backdrop-blur: blur(20px) saturate(180%);
}

.dark {
  --background: #000000;
  --foreground: #ffffff;

  --card: #1c1c1e;
  --card-foreground: #ffffff;

  --popover: #1c1c1e;
  --popover-foreground: #ffffff;

  --muted: #8e8e93;
  --muted-foreground: #aeaeb2;

  --accent: #2c2c2e;
  --accent-foreground: #ffffff;

  --border: #38383a;
  --input: #48484a;
  --ring: #ffffff;

  --primary: #ffffff;
  --primary-foreground: #000000;
  --primary-hover: #f2f2f7;
  --primary-soft: rgba(255, 255, 255, 0.1);

  --secondary: #2c2c2e;
  --secondary-foreground: #ffffff;

  --destructive: #ff453a;
  --success: #30d158;

  --surface-elevated: #1c1c1e;
  --surface-hover: #2c2c2e;
  --surface-pressed: #3a3a3c;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.24);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.32);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.4);
  --shadow-xl: 0 24px 80px rgba(0, 0, 0, 0.48);
}

    </style>

    --color-destructive: var(--destructive);
    --color-destructive-foreground: var(--destructive-foreground);
    --color-border: var(--border);
    --color-input: var(--input);
    --color-ring: var(--ring);
    --radius-sm: var(--radius-sm);
    --radius-md: var(--radius-md);
    --radius-lg: var(--radius-lg);
    --radius-xl: var(--radius-xl);
  }
  @layer base {
    body { background: var(--background); color: var(--foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
