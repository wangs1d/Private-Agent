/*
 * Flutter App UI - Monochrome Design Tokens
 * Platform: Android + HarmonyOS
 * Style: Minimalist, clean, space-efficient
 * Theme: Light + Dark (Black & White)
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  /* solo-design consumption aliases */
  --mono-background: var(--background, #ffffff);
  --mono-foreground: var(--foreground, #111111);
  --mono-card: var(--card, var(--background));
  --mono-card-foreground: var(--card-foreground, var(--foreground));
  --mono-popover: var(--popover, var(--card));
  --mono-popover-foreground: var(--popover-foreground, var(--card-foreground));
  --mono-primary: var(--primary, #000000);
  --mono-primary-foreground: var(--primary-foreground, #ffffff);
  --mono-secondary: var(--secondary, var(--muted));
  --mono-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --mono-muted: var(--muted, #f5f5f5);
  --mono-muted-foreground: var(--muted-foreground, #888888);
  --mono-accent: var(--accent, var(--secondary));
  --mono-accent-foreground: var(--accent-foreground, var(--foreground));
  --mono-destructive: var(--destructive, #000000);
  --mono-destructive-foreground: var(--destructive-foreground, #ffffff);
  --mono-border: var(--border, #e5e5e5);
  --mono-input: var(--input, var(--border));
  --mono-ring: var(--ring, var(--primary));
  --mono-chart-1: var(--chart-1, var(--primary));
  --mono-chart-2: var(--chart-2, var(--muted-foreground));
  --mono-chart-3: var(--chart-3, var(--foreground));
  --mono-chart-4: var(--chart-4, var(--muted-foreground));
  --mono-chart-5: var(--chart-5, var(--foreground));
  --mono-sidebar: var(--sidebar, var(--background));
  --mono-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --mono-sidebar-primary: var(--sidebar-primary, var(--primary));
  --mono-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --mono-sidebar-accent: var(--sidebar-accent, var(--muted));
  --mono-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--foreground));

  /* radius aliases */
  --mono-radius-sm: var(--radius-sm, 4px);
  --mono-radius-md: var(--radius-md, 8px);
  --mono-radius-lg: var(--radius-lg, 12px);
  --mono-radius-small: var(--radius-sm, 4px);
  --mono-radius-medium: var(--radius-md, 8px);
  --mono-radius-large: var(--radius-lg, 12px);

  /* ===== PRIMITIVE PALETTE - Monochrome ===== */

  /* brand - pure black */
  --brand-50: #f5f5f5;
  --brand-100: #e5e5e5;
  --brand-200: #d4d4d4;
  --brand-300: #a3a3a3;
  --brand-400: #737373;
  --brand-500: #000000; /* @primary - pure black */
  --brand-600: #0a0a0a;
  --brand-700: #171717;
  --brand-800: #262626;
  --brand-900: #111111;

  /* background */
  --background-50: #ffffff;
  --background-100: #fafafa;
  --background-200: #f5f5f5;
  --background-300: #e5e5e5;
  --background-400: #d4d4d4;
  --background-500: #a3a3a3;
  --background-600: #737373;
  --background-700: #525252;
  --background-800: #262626;
  --background-900: #0a0a0a;

  /* text */
  --text-50: #fafafa;
  --text-100: #f5f5f5;
  --text-200: #e5e5e5;
  --text-300: #d4d4d4;
  --text-400: #a3a3a3;
  --text-500: #737373;
  --text-600: #525252;
  --text-700: #404040;
  --text-800: #262626;
  --text-900: #111111;

  /* icon */
  --icon-50: #fafafa;
  --icon-100: #f5f5f5;
  --icon-200: #e5e5e5;
  --icon-300: #d4d4d4;
  --icon-400: #a3a3a3;
  --icon-500: #737373;
  --icon-600: #525252;
  --icon-700: #404040;
  --icon-800: #262626;
  --icon-900: #111111;

  /* state - monochrome variants */
  --state-success: #171717;
  --state-success-dark: #e5e5e5;
  --state-success-surface: #f5f5f5;
  --state-success-foreground: #ffffff;

  --state-error: #171717;
  --state-error-dark: #e5e5e5;
  --state-error-surface: #fafafa;
  --state-error-foreground: #ffffff;

  --state-warning: #404040;
  --state-info: #525252;

  /* ===== SEMANTIC ROLES ===== */

  --background: var(--background-50);
  --foreground: var(--text-900);
  --card: var(--background-50);
  --card-foreground: var(--text-900);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-100);
  --secondary-foreground: var(--text-900);
  --muted: var(--background-200);
  --muted-foreground: var(--text-500);
  --accent: var(--background-100);
  --accent-foreground: var(--text-900);
  --destructive: var(--text-900);
  --destructive-foreground: var(--background-50);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-300);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart - monochrome */
  --chart-1: var(--text-900);
  --chart-2: var(--text-500);
  --chart-3: var(--text-700);
  --chart-4: var(--text-400);
  --chart-5: var(--text-600);

  /* sidebar */
  --sidebar: var(--background-100);
  --sidebar-foreground: var(--text-900);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-200);
  --sidebar-accent-foreground: var(--text-900);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* ===== TYPOGRAPHY ===== */
  --font-sans: 'Roboto', 'HarmonyOS Sans', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
  --font-mono: 'Roboto Mono', 'JetBrains Mono', monospace;
  --tracking-normal: 0em;
  --tracking-tight: -0.01em;
  --tracking-wide: 0.02em;

  /* ===== RADIUS - Material-inspired ===== */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;
  --radius: 12px;

  /* ===== SHADOWS - Subtle monochrome ===== */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.03);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.04), 0 1px 3px -1px rgba(0, 0, 0, 0.04);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.07), 0 4px 8px -4px rgba(0, 0, 0, 0.04);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.09), 0 8px 16px -8px rgba(0, 0, 0, 0.05);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.10);

  /* ===== SPACING ===== */
  --spacing: 4px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* ===== MOTION ===== */
  --motion-fast: 150ms;
  --motion-base: 250ms;
  --motion-slow: 350ms;
  --easing-standard: cubic-bezier(0.4, 0, 0.2, 1);
  --easing-accelerate: cubic-bezier(0.4, 0, 1, 1);
  --easing-decelerate: cubic-bezier(0, 0, 0.2, 1);
}

/* ===== DARK THEME ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-800);
  --popover-foreground: var(--text-50);

  --primary: var(--text-50);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-700);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--text-50);
  --destructive-foreground: var(--background-900);
  --success: var(--state-success-dark);
  --success-foreground: var(--background-900);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--text-50);

  --icon: var(--icon-50);

  --chart-1: var(--text-50);
  --chart-2: var(--text-400);
  --chart-3: var(--text-200);
  --chart-4: var(--text-500);
  --chart-5: var(--text-300);

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--text-50);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--text-50);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.4);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.5), 0 1px 3px -1px rgba(0, 0, 0, 0.5);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.55), 0 1px 2px -1px rgba(0, 0, 0, 0.5);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.6), 0 2px 4px -2px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.7), 0 4px 8px -4px rgba(0, 0, 0, 0.55);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.75), 0 8px 16px -8px rgba(0, 0, 0, 0.6);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.8);
}
