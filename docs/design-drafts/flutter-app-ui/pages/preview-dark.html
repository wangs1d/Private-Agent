<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌面端暗色预览</title>
  <link rel="stylesheet" href="../colors_and_type_desktop.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <style id="theme-vars">
    :root {
      --preview-bg: #050508;
      --window-border: #ffffff10;
      --window-shadow: rgba(0, 0, 0, 0.50);
    }
  </style>
  <style id="critical-layout">
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--preview-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: var(--font-sans);
    }
    .window {
      width: 1280px;
      height: 800px;
      max-width: 100%;
      background: var(--background);
      border-radius: 16px;
      box-shadow: 0 24px 64px -12px var(--window-shadow);
      overflow: hidden;
      display: flex;
      border: 1px solid var(--window-border);
    }
    .sidebar {
      width: 72px;
      background: var(--sidebar);
      border-right: 1px solid var(--sidebar-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0 16px;
      box-shadow: 8px 0 28px -6px rgba(0,0,0,0.35);
      z-index: 10;
    }
    .brand {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #5b8def, #3b6fd6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0a0a0c;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(91, 141, 239, 0.35);
    }
    .nav-items { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .nav-item {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7b7b85;
      cursor: pointer;
      transition: all 150ms ease;
    }
    .nav-item:hover { background: var(--sidebar-accent); color: #f4f4f6; }
    .nav-item.active { background: rgba(255,255,255,0.08); color: #ffffff; }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      height: 56px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }
    .topbar-title { font-size: 15px; font-weight: 600; color: var(--foreground); }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      color: #9e9ea6; cursor: pointer;
      transition: background 150ms ease;
    }
    .icon-btn:hover { background: var(--sidebar-accent); color: #f4f4f6; }
    .content { flex: 1; display: flex; min-height: 0; }
    .chat-list {
      width: 300px;
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .chat-list-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      color: #7b7b85;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .chat-item {
      padding: 14px 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 150ms ease;
    }
    .chat-item:hover { background: var(--sidebar-accent); }
    .chat-item.active { background: rgba(255,255,255,0.08); }
    .avatar {
      width: 40px; height: 40px; border-radius: 999px;
      background: var(--sidebar-accent); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: #9e9ea6; font-weight: 600; font-size: 13px;
    }
    .chat-meta { flex: 1; min-width: 0; }
    .chat-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .chat-name { font-size: 14px; font-weight: 600; color: var(--foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-time { font-size: 12px; color: #7b7b85; flex-shrink: 0; }
    .chat-preview { font-size: 13px; color: #9e9ea6; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-detail {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--background);
      min-width: 0;
    }
    .detail-header {
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
    }
    .detail-title { font-size: 16px; font-weight: 600; color: var(--foreground); }
    .detail-status { font-size: 12px; color: var(--state-success); display: flex; align-items: center; gap: 4px; }
    .messages { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .msg { max-width: 70%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
    .msg-in { align-self: flex-start; background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg-out { align-self: flex-end; background: var(--primary); color: var(--primary-foreground); border-bottom-right-radius: 4px; }
    .input-bar {
      padding: 16px 24px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .input-field {
      flex: 1;
      height: 44px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--muted);
      padding: 0 18px;
      font-size: 14px;
      color: var(--foreground);
      outline: none;
    }
    .input-field::placeholder { color: #7b7b85; }
    .send-btn {
      width: 44px; height: 44px; border-radius: 999px;
      background: var(--primary); color: var(--primary-foreground);
      display: flex; align-items: center; justify-content: center;
      border: none; cursor: pointer;
      box-shadow: 0 4px 16px rgba(91, 141, 239, 0.35);
    }
  </style>
</head>
<body>
  <div class="window" data-dom-id="desktop-window-dark">
    <aside class="sidebar">
      <div class="brand">AI</div>
      <nav class="nav-items">
        <div class="nav-item active" data-dom-id="nav-chat-dark" title="对话">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </div>
        <div class="nav-item" data-dom-id="nav-calendar-dark" title="日程">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        </div>
        <div class="nav-item" data-dom-id="nav-devices-dark" title="设备">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line></svg>
        </div>
      </nav>
      <div class="avatar" data-dom-id="user-avatar-dark">K</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">对话</div>
        <div class="topbar-actions">
          <div class="icon-btn" data-dom-id="theme-toggle-dark" title="切换浅色主题">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          </div>
          <div class="icon-btn" title="更多">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
          </div>
        </div>
      </header>

      <div class="content">
        <div class="chat-list">
          <div class="chat-list-header">最近对话</div>
          <div class="chat-item active" data-dom-id="chat-item-1-dark">
            <div class="avatar">AI</div>
            <div class="chat-meta">
              <div class="chat-row"><span class="chat-name">AI 助手</span><span class="chat-time">10:42</span></div>
              <div class="chat-preview">已为你生成设计稿，请查看画布。</div>
            </div>
          </div>
          <div class="chat-item" data-dom-id="chat-item-2-dark">
            <div class="avatar">产</div>
            <div class="chat-meta">
              <div class="chat-row"><span class="chat-name">产品小分队</span><span class="chat-time">09:15</span></div>
              <div class="chat-preview">下周评审时间确认一下？</div>
            </div>
          </div>
          <div class="chat-item">
            <div class="avatar">设</div>
            <div class="chat-meta">
              <div class="chat-row"><span class="chat-name">设计系统</span><span class="chat-time">昨天</span></div>
              <div class="chat-preview">新的颜色 token 已同步。</div>
            </div>
          </div>
        </div>

        <div class="chat-detail">
          <div class="detail-header">
            <div class="avatar">AI</div>
            <div>
              <div class="detail-title">AI 助手</div>
              <div class="detail-status"><span>●</span> 在线</div>
            </div>
          </div>
          <div class="messages">
            <div class="msg msg-in">你好，我需要为 Flutter 桌面应用生成一套新的 UI 设计稿。</div>
            <div class="msg msg-out">好的，已按你的要求完成浅色与暗色两套主题，侧栏使用 72px 宽度并加入品牌徽标。</div>
            <div class="msg msg-in">整个窗口的效果可以展示一下吗？</div>
            <div class="msg msg-out">当然可以，当前页面就是暗色主题的高保真预览。</div>
          </div>
          <div class="input-bar">
            <input class="input-field" type="text" placeholder="输入消息..." data-dom-id="message-input-dark">
            <button class="send-btn" data-dom-id="send-btn-dark">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
