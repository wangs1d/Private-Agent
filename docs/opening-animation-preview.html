<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXTBOT 首次启动 · 开场动画预览</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 24 V8 L23 24 V8' fill='none' stroke='%235FA8FF' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --accent:#5FA8FF;
    --glow:#8FD0FF;
    --text:#E6EEF8;
    --muted:#8FA6C8;
    --line:#1E2F4E;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:#04060C;
    color:var(--text);
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }
  #stage{position:fixed;inset:0;}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;}

  /* ===== 中央信息层 ===== */
  #ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12vh;pointer-events:none;text-align:center;}

  /* 等待点击唤醒 */
  #tapStart{
    display:none;
    font-size:clamp(13px,1.8vw,16px);
    letter-spacing:.32em;
    color:var(--muted);
    animation:softPulse 2.2s ease-in-out infinite;
    text-indent:.32em;
  }
  #tapStart.show{display:block;}
  @keyframes softPulse{0%,100%{opacity:.35;}50%{opacity:1;}}

  /* 聆听指示：三条波形短线 */
  #listen{
    display:none;
    align-items:flex-end;
    justify-content:center;
    gap:6px;
    height:34px;
  }
  #listen.show{display:flex;}
  #listen i{
    width:3px;border-radius:2px;
    background:var(--glow);
    box-shadow:0 0 10px rgba(143,208,255,.6);
    animation:wave 1s ease-in-out infinite;
  }
  #listen i:nth-child(1){height:12px;animation-delay:-.4s;}
  #listen i:nth-child(2){height:30px;animation-delay:-.2s;}
  #listen i:nth-child(3){height:20px;animation-delay:-.6s;}
  #listen i:nth-child(4){height:30px;animation-delay:0s;}
  #listen i:nth-child(5){height:12px;animation-delay:-.3s;}
  @keyframes wave{0%,100%{transform:scaleY(.35);}50%{transform:scaleY(1);}}

  /* 觉醒气泡 */
  #bubble{
    display:none;
    max-width:min(560px,86vw);
    font-size:clamp(22px,4.4vw,40px);
    font-weight:800;
    letter-spacing:.12em;
    color:#F4F8FF;
    text-shadow:0 0 26px rgba(143,208,255,.55);
    line-height:1.4;
  }
  #bubble.show{display:block;animation:rise .6s cubic-bezier(.22,1,.36,1) both;}
  #bubble .byline{margin-top:14px;font-size:12px;font-weight:400;letter-spacing:.28em;color:var(--muted);text-shadow:none;}
  @keyframes rise{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:none;}}

  /* ===== 顶栏 ===== */
  #topbar{position:absolute;top:18px;right:20px;display:flex;gap:10px;z-index:5;}
  .tbtn{
    background:rgba(13,23,48,.55);
    border:1px solid var(--line);
    color:var(--muted);
    font-size:12px;
    letter-spacing:.08em;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:all .18s;
  }
  .tbtn:hover{color:var(--text);border-color:var(--accent);}

  /* ===== 结束屏 ===== */
  #end{
    position:absolute;inset:0;
    display:none;
    flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    z-index:4;
  }
  #end.show{display:flex;}
  #end .logo{
    font-size:clamp(52px,10vw,92px);
    font-weight:800;
    letter-spacing:.16em;
    background:linear-gradient(180deg,#FDFEFF 0%,#D8E1EC 40%,#6B7380 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 26px rgba(143,208,255,.35));
  }
  #end .sub{margin-top:18px;font-size:13px;letter-spacing:.3em;color:var(--muted);}
  #end .greet{margin-top:8px;font-size:15px;color:var(--glow);letter-spacing:.1em;min-height:1.4em;}
  #replayBtn{
    margin-top:34px;
    padding:11px 34px;
    font-size:14px;
    font-weight:700;
    letter-spacing:.1em;
    color:var(--text);
    background:transparent;
    border:1px solid var(--accent);
    border-radius:999px;
    cursor:pointer;
    transition:all .2s;
  }
  #replayBtn:hover{background:rgba(95,168,255,.14);box-shadow:0 0 18px rgba(95,168,255,.25);}

  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  @media (max-width:640px){
    .tbtn{min-height:44px;font-size:13px;}
    #end .sub{font-size:14px;}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="ui">
    <div id="tapStart">点击屏幕 · 开始语音确认</div>
    <div id="listen"><i></i><i></i><i></i><i></i><i></i></div>
    <div id="bubble"></div>
  </div>

  <div id="topbar">
    <button id="soundBtn" class="tbtn">语音：开</button>
    <button id="skipBtn" class="tbtn">跳过动画</button>
  </div>

  <div id="end">
    <div class="logo">NEXTBOT</div>
    <div class="sub">已记住你的声音偏好</div>
    <div class="greet" id="greetText"></div>
    <button id="replayBtn">重新播放</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var tapStart = document.getElementById("tapStart");
  var listenEl = document.getElementById("listen");
  var bubble = document.getElementById("bubble");
  var endScreen = document.getElementById("end");
  var greetText = document.getElementById("greetText");
  var soundBtn = document.getElementById("soundBtn");
  var skipBtn = document.getElementById("skipBtn");
  var replayBtn = document.getElementById("replayBtn");

  var W = 0, H = 0, DPR = 1;

  // —— 状态 ——
  var animTime = 0;        // 动画时钟（秒），交互阶段冻结
  var phaseWait = false;   // 等待用户点击开始语音
  var voiceFlow = false;   // 语音对话进行中
  var voiceStage = "idle"; // idle | ask | listen | confirm | done
  var ended = false;
  var voice = "female";    // female | male
  var soundOn = true;
  var particles = [];
  var particlesReady = false;
  var spoken = false;
  var reduced = false;
  try { reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){}

  // —— 画布尺寸 ——
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // —— 阶段判定 ——
  // P0 唤醒 0-1.0 | P1 描线 1.0-3.6 | P2 语音(交互) | P3 生成 4-7 | P4 凝聚 7-9 | P5 觉醒 9-11 | P6 入场 11-12
  function phase(){
    if (animTime < 1.0) return 0;
    if (animTime < 3.6) return 1;
    if (phaseWait || voiceFlow) return 2;
    if (animTime < 4.0) return 1.5;
    if (animTime < 7.0) return 3;
    if (animTime < 9.0) return 4;
    if (animTime < 11.0) return 5;
    return 6;
  }

  // —— N 的路径点（居中，三段：左竖 → 斜线 → 右竖）——
  function nPoints(cx, cy, scale){
    var w = scale * 0.62, h = scale;
    var x0 = cx - w, x1 = cx + w;
    var y0 = cy - h, y1 = cy + h;
    return [
      {x:x0, y:y1},   // 左下
      {x:x0, y:y0},   // 左上
      {x:x1, y:y1},   // 右下
      {x:x1, y:y0}    // 右上
    ];
  }
  // 沿 N 的三段折线按长度比例取插值点
  function nPointAt(pts, p){
    var segs = [
      {a:pts[0], b:pts[1]},
      {a:pts[1], b:pts[2]},
      {a:pts[2], b:pts[3]}
    ];
    var lens = segs.map(function(s){ return Math.hypot(s.b.x-s.a.x, s.b.y-s.a.y); });
    var total = lens[0] + lens[1] + lens[2];
    var d = p * total;
    var acc = 0;
    for (var i = 0; i < segs.length; i++){
      if (d <= acc + lens[i] || i === segs.length - 1){
        var t = lens[i] === 0 ? 0 : Math.min(1, Math.max(0, (d - acc) / lens[i]));
        return {x: segs[i].a.x + (segs[i].b.x - segs[i].a.x) * t,
                y: segs[i].a.y + (segs[i].b.y - segs[i].a.y) * t};
      }
      acc += lens[i];
    }
    return pts[3];
  }

  // —— 粒子（P3 汇聚）——
  function initParticles(){
    particles = [];
    var n = 30;
    for (var i = 0; i < n; i++){
      var ang = (i / n) * Math.PI * 2 + Math.random() * 0.5;
      var rad = Math.min(W, H) * (0.34 + Math.random() * 0.2);
      particles.push({
        x: W/2 + Math.cos(ang) * rad,
        y: H/2 + Math.sin(ang) * rad,
        a: 0.45 + Math.random() * 0.35,
        r: 1 + Math.random() * 1.5,
        v: 0.07 + Math.random() * 0.09
      });
    }
    particlesReady = true;
  }

  // —— TTS ——
  function speak(text, cb){
    if (!soundOn){ if (cb) setTimeout(cb, 600); return; }
    if (!("speechSynthesis" in window)){ if (cb) setTimeout(cb, 600); return; }
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      u.rate = 1.0;
      u.pitch = voice === "female" ? 1.35 : 0.72;
      if (cb) u.onend = cb;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } catch(e){ if (cb) setTimeout(cb, 600); }
  }

  // —— 语音识别 ——
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recog = null;
  var listenTimer = null;

  function startListen(){
    if (listenTimer) clearTimeout(listenTimer);
    listenEl.classList.add("show");
    if (!SR){ // 浏览器不支持 → 兜底默认女声
      setTimeout(function(){ listenEl.classList.remove("show"); voiceDone("female"); }, 400);
      return;
    }
    try {
      recog = new SR();
      recog.lang = "zh-CN";
      recog.interimResults = false;
      recog.maxAlternatives = 1;
      recog.onresult = function(ev){
        var txt = "";
        for (var i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
        var v = (txt.indexOf("男") >= 0) ? "male" : ((txt.indexOf("女") >= 0) ? "female" : null);
        if (v) voiceDone(v); else voiceDone("female");
      };
      recog.onerror = function(){ voiceDone("female"); };
      recog.onend = function(){ /* 已由 onresult 处理 */ };
      recog.start();
      // 8s 超时兜底
      listenTimer = setTimeout(function(){
        try { if (recog) recog.abort(); } catch(e){}
        voiceDone("female");
      }, 8000);
    } catch(e){
      voiceDone("female");
    }
  }

  function voiceDone(v){
    if (listenTimer){ clearTimeout(listenTimer); listenTimer = null; }
    listenEl.classList.remove("show");
    voice = v;
    voiceStage = "confirm";
    speak(v === "male" ? "好的，就用男声。" : "好的，就用女声。", function(){
      voiceStage = "done";
      voiceFlow = false;
      animTime = 4.0;
    });
  }

  // —— 主绘制 ——
  function draw(){
    var cx = W / 2, cy = H / 2;
    var base = Math.min(W, H);
    ctx.clearRect(0, 0, W, H);

    // 背景（P0 渐现）
    var bgA = Math.min(1, animTime / 1.0);
    var bg = ctx.createRadialGradient(cx, cy * 0.7, 0, cx, cy, Math.max(W, H) * 0.75);
    bg.addColorStop(0, "rgba(10,20,40," + (0.9 * bgA) + ")");
    bg.addColorStop(0.55, "rgba(6,10,20," + (0.95 * bgA) + ")");
    bg.addColorStop(1, "rgba(4,6,12," + bgA + ")");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    var p = phase();

    // N 描线（P1 起，P4 收敛）
    if (p >= 1 && p < 5){
      var drawP = Math.min(1, Math.max(0, (animTime - 1.0) / 2.6));
      var morph = 1;
      if (p >= 4) morph = Math.max(0, 1 - (animTime - 7) / 2);
      var scale = base * 0.21 * (0.4 + 0.6 * drawP) * morph;
      var pts = nPoints(cx, cy, scale);
      // 收敛：所有点向中心插值
      if (morph < 1){
        var m = 1 - morph;
        for (var i = 0; i < pts.length; i++){
          pts[i].x += (cx - pts[i].x) * m;
          pts[i].y += (cy - pts[i].y) * m;
        }
      }
      var alpha = drawP * morph;
      var segA = [
        {a:pts[0], b:pts[1]},
        {a:pts[1], b:pts[2]},
        {a:pts[2], b:pts[3]}
      ];
      var lens = segA.map(function(s){ return Math.hypot(s.b.x-s.a.x, s.b.y-s.a.y); });
      var total = lens[0] + lens[1] + lens[2];
      var d = drawP * total;
      ctx.strokeStyle = "rgba(143,208,255," + (0.92 * alpha) + ")";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowColor = "rgba(143,208,255," + (0.55 * alpha) + ")";
      ctx.shadowBlur = 14;
      ctx.beginPath();
      var acc = 0;
      for (var s = 0; s < segA.length; s++){
        var seg = segA[s];
        var drawLen = Math.max(0, Math.min(lens[s], d - acc));
        var t2 = lens[s] === 0 ? 0 : drawLen / lens[s];
        var endX = seg.a.x + (seg.b.x - seg.a.x) * t2;
        var endY = seg.a.y + (seg.b.y - seg.a.y) * t2;
        ctx.moveTo(seg.a.x, seg.a.y);
        ctx.lineTo(endX, endY);
        acc += lens[s];
        if (d <= acc) break;
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
      // 线端亮点
      if (drawP > 0 && drawP < 1 && p < 4){
        var tip = nPointAt(pts, drawP);
        ctx.beginPath();
        ctx.arc(tip.x, tip.y, 2.6, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(233,246,255," + (0.95 * alpha) + ")";
        ctx.fill();
      }
    }

    // 粒子汇聚（P3）
    if (p >= 3 && p < 4){
      if (!particlesReady) initParticles();
      for (var j = 0; j < particles.length; j++){
        var pt = particles[j];
        pt.x += (cx - pt.x) * pt.v * 0.06;
        pt.y += (cy - pt.y) * pt.v * 0.06;
        var pa = pt.a * (1 - Math.min(1, Math.hypot(pt.x-cx, pt.y-cy) / (base*0.6)));
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(143,208,255," + Math.max(0, pa) + ")";
        ctx.fill();
      }
    }

    // 球形化身（P4 起）
    if (p >= 4){
      var grow = Math.min(1, (animTime - 7) / 1.2);
      var ease = 1 - Math.pow(1 - grow, 3);
      var ballR = base * 0.135 * ease;
      if (ballR > 0){
        var g = ctx.createRadialGradient(cx - ballR*0.3, cy - ballR*0.35, ballR*0.1, cx, cy, ballR);
        g.addColorStop(0, "#C9E9FF");
        g.addColorStop(0.45, "#8FD0FF");
        g.addColorStop(1, "#1E3A5F");
        ctx.shadowColor = "rgba(143,208,255," + (0.5 * ease) + ")";
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.arc(cx, cy, ballR, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(cx - ballR*0.3, cy - ballR*0.35, ballR*0.28, 0, Math.PI*2);
        ctx.fillStyle = "rgba(255,255,255," + (0.28 * ease) + ")";
        ctx.fill();
      }
    }

    // 声波（P5）
    if (p >= 5){
      var t5 = animTime - 9;
      for (var k = 0; k < 3; k++){
        var age = t5 - k * 0.55;
        if (age < 0 || age > 2.0) continue;
        var rr = base * 0.135 + age * base * 0.30;
        var aa = Math.max(0, (1 - age / 2.0)) * 0.30;
        ctx.beginPath();
        ctx.arc(cx, cy, rr, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(143,208,255," + aa + ")";
        ctx.lineWidth = 1.6;
        ctx.stroke();
      }
    }
  }

  // —— 界面切换 ——
  function syncUI(){
    var p = phase();

    // P1 结束 → 等待点击开始语音
    if (p === 2 && !phaseWait && !voiceFlow){
      phaseWait = true;
    }
    tapStart.classList.toggle("show", p === 2 && phaseWait);

    // 觉醒
    if (p === 5){
      if (!bubble.classList.contains("show")){
        bubble.innerHTML = "我在这里。" + '<div class="byline">NEXTBOT · 已就位</div>';
        bubble.classList.add("show");
      }
      if (!spoken){ spoken = true; speak("我在这里。"); }
    }
    if (p >= 6 && !ended) finish();
  }

  function finish(){
    ended = true;
    tapStart.classList.remove("show");
    listenEl.classList.remove("show");
    bubble.classList.remove("show");
    endScreen.classList.add("show");
    greetText.textContent = voice === "male" ? "声音偏好：男声" : "声音偏好：女声";
  }

  function resetAll(){
    animTime = 0; phaseWait = false; voiceFlow = false; voiceStage = "idle";
    ended = false; spoken = false; particlesReady = false; particles = [];
    if (listenTimer){ clearTimeout(listenTimer); listenTimer = null; }
    if (recog){ try { recog.abort(); } catch(e){} recog = null; }
    tapStart.classList.remove("show");
    listenEl.classList.remove("show");
    bubble.classList.remove("show"); bubble.innerHTML = "";
    endScreen.classList.remove("show");
    greetText.textContent = "";
  }

  // —— 点击：开始语音 / 跳过 ——
  document.addEventListener("click", function(ev){
    if (endScreen.classList.contains("show")) return;
    if (ev.target.closest("#topbar")) return;
    if (phaseWait){
      phaseWait = false;
      tapStart.classList.remove("show");
      if (!soundOn || !SR){
        // 语音关闭或不支持 → 默认女声直接继续
        voiceDone("female");
        return;
      }
      voiceFlow = true;
      voiceStage = "ask";
      speak("你希望我是男声，还是女声？", function(){
        voiceStage = "listen";
        startListen();
      });
      return;
    }
    if (voiceFlow) return;
    finish();
  });

  // —— 顶栏 ——
  skipBtn.addEventListener("click", finish);
  replayBtn.addEventListener("click", function(){ resetAll(); });
  var soundOnFlip = false;
  soundBtn.addEventListener("click", function(){
    soundOnFlip = !soundOnFlip;
    soundOn = !soundOnFlip;
    soundBtn.textContent = soundOn ? "语音：开" : "语音：关";
    if (!soundOn){
      if ("speechSynthesis" in window){ try { window.speechSynthesis.cancel(); } catch(e){} }
      if (recog){ try { recog.abort(); } catch(e){} }
    }
  });

  // —— 主循环 ——
  var last = null;
  function frame(ts){
    if (last === null) last = ts;
    var dt = (ts - last) / 1000;
    last = ts;
    if (!phaseWait && !voiceFlow && !ended){
      animTime += dt;
      if (animTime > 12) animTime = 12;
    }
    syncUI();
    draw();
    requestAnimationFrame(frame);
  }

  if (reduced){
    finish();
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
