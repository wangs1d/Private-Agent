# NEXTBOT — nextbot.top 80 端口路由（2026-09-29）
# 统一入口（取代原 iptables 80→3000 转发）：
#   - login.nextbot.top  → Node 登录页；根路径 302 到 /accounts/web（保留 cb/state 参数）
#   - 其余（IP 直访 / nextbot.top / www）→ Node 主服务，落地页在 /
# Node 主服务常驻 127.0.0.1:3000（systemd: private-agent）。
# 持久化注意：/etc/iptables/rules.v4 里的 REDIRECT 规则必须与本项目同时摘除，
# 否则重启后内核层转发会绕过 nginx。

# WebSocket Upgrade 头映射（ws 聊天 / 语音 duplex 透传必需）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 默认块：IP 直访与所有未匹配域名的保底，行为与此前 80→3000 完全一致
server {
    listen 80 default_server;
    server_name _;

    # 图片上传 / 图库等请求体放宽（nginx 默认 1m 会掐断）
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 长连接（WebSocket / SSE）不被默认 60s 空闲超时掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# 登录子域：login.nextbot.top → 登录页
server {
    listen 80;
    server_name login.nextbot.top;

    client_max_body_size 20m;

    # 根路径直接亮登录页；保留 cb/state 等查询参数
    location = / {
        return 302 /accounts/web$is_args$args;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
