<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nextbot Entrance Preview</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: #000;
        color: white;
        font-family: "Bahnschrift SemiCondensed", "Arial Narrow", "Segoe UI", sans-serif;
      }

      .stage {
        position: relative;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .copy {
        position: relative;
        width: min(88vw, 1080px);
        text-align: center;
      }

      .title-wrap {
        position: relative;
        display: inline-block;
      }

      .title-shadow {
        position: absolute;
        inset: 0;
        margin: 0;
        font-size: clamp(64px, 10vw, 118px);
        line-height: 0.96;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        transform: skewX(-4deg);
        color: rgba(203, 230, 255, 0.12);
        filter: blur(28px);
      }

      .title-layer {
        position: relative;
        display: inline-block;
      }

      .title-base,
      .title-scan {
        margin: 0;
        font-size: clamp(64px, 10vw, 118px);
        line-height: 0.96;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        transform: skewX(-4deg);
      }

      .title-base {
        position: relative;
        background: linear-gradient(180deg, #fdfeff, #d8e1ec 38%, #69717d);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow:
          0 0 10px rgba(255, 255, 255, 0.06),
          0 0 40px rgba(179, 217, 255, 0.08);
      }

      .title-scan {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.16) 64%,
          rgba(255, 255, 255, 0.92) 72%,
          rgba(217, 238, 255, 0.52) 78%,
          transparent 84%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: brightness(1.08);
      }

      .subtitle {
        margin-top: 22px;
        font-size: 11px;
        letter-spacing: 0.56em;
        color: rgba(232, 238, 248, 0.62);
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="copy">
        <div class="title-wrap">
          <h1 class="title-shadow">NEXTBOT</h1>
          <div class="title-layer">
            <h1 class="title-base">NEXTBOT</h1>
            <h1 class="title-scan">NEXTBOT</h1>
          </div>
        </div>
        <div class="subtitle">SYSTEM ONLINE</div>
      </section>
    </main>
  </body>
</html>
