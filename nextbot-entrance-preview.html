<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nextbot Entrance Preview</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: #000;
        color: white;
        font-family: "Bahnschrift SemiCondensed", "Arial Narrow", "Segoe UI", sans-serif;
      }

      .stage {
        position: relative;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .copy {
        position: relative;
        z-index: 2;
        width: min(88vw, 1080px);
        text-align: center;
        animation: copyFadeOut 1.2s ease-in 3s forwards;
      }

      .title-wrap {
        position: relative;
        display: inline-block;
        opacity: 0;
        animation: titleReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) 200ms forwards;
      }

      .title-shadow {
        position: absolute;
        inset: 0;
        margin: 0;
        font-size: clamp(64px, 10vw, 118px);
        line-height: 0.96;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        transform: skewX(-4deg);
        color: rgba(203, 230, 255, 0.12);
        filter: blur(28px);
      }

      .title-layer {
        position: relative;
        display: inline-block;
      }

      .title-base,
      .title-scan {
        margin: 0;
        font-size: clamp(64px, 10vw, 118px);
        line-height: 0.96;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        transform: skewX(-4deg);
      }

      .title-base {
        position: relative;
        background: linear-gradient(180deg, #fdfeff, #d8e1ec 38%, #69717d);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow:
          0 0 10px rgba(255, 255, 255, 0.06),
          0 0 40px rgba(179, 217, 255, 0.08);
      }

      .title-scan {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.16) 64%,
          rgba(255, 255, 255, 0.92) 72%,
          rgba(217, 238, 255, 0.52) 78%,
          transparent 84%
        );
        background-repeat: no-repeat;
        background-size: 15% 100%;
        background-position: -90% 0;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: brightness(1.08);
        animation: scanSweep 1.7s ease-in-out 1s forwards;
      }

      .subtitle {
        margin-top: 22px;
        font-size: 11px;
        letter-spacing: 0.56em;
        color: #E8EEF8;
        opacity: 0;
        animation: subtitleFade 1.4s ease-out 1s forwards;
      }

      /* ===== Boot overlay: pure black for 200ms, then fades away ===== */
      .boot-overlay {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 50;
        opacity: 1;
        animation: bootFade 500ms ease-out 200ms forwards;
      }

      /* ===== Blurred particle field ===== */
      .particle-field {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 1;
      }

      .particle {
        position: absolute;
        top: 0;
        left: 0;
        border-radius: 50%;
        filter: blur(1px);
        will-change: transform;
      }

      /* ===== Keyframes ===== */
      @keyframes titleReveal {
        0% {
          opacity: 0;
          transform: translateY(44px) scale(0.82);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes scanSweep {
        0% {
          background-position: -90% 0;
          background-size: 15% 100%;
        }
        100% {
          background-position: 90% 0;
          background-size: 60% 100%;
        }
      }

      @keyframes subtitleFade {
        0% { opacity: 0; }
        100% { opacity: 0.62; }
      }

      @keyframes copyFadeOut {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }

      @keyframes bootFade {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div class="boot-overlay"></div>
    <div class="particle-field" id="particleField"></div>
    <main class="stage">
      <section class="copy">
        <div class="title-wrap">
          <h1 class="title-shadow">NEXTBOT</h1>
          <div class="title-layer">
            <h1 class="title-base">NEXTBOT</h1>
            <h1 class="title-scan">NEXTBOT</h1>
          </div>
        </div>
        <div class="subtitle">SYSTEM ONLINE</div>
      </section>
    </main>
    <script>
      (function () {
        const field = document.getElementById('particleField');
        const PARTICLE_COUNT = 20;
        const particles = [];
        // Solid white/blue tints; per-particle opacity controls visibility
        const palette = ['#F3FAFF', '#E6F3FF', '#CFE4FF', '#7AB8FF', '#4A9DFF'];

        function rand(min, max) {
          return min + Math.random() * (max - min);
        }

        function createParticles() {
          const w = window.innerWidth;
          const h = window.innerHeight;
          for (let i = 0; i < PARTICLE_COUNT; i++) {
            const el = document.createElement('div');
            el.className = 'particle';
            const radius = rand(1, 3);        // 1-3px radius
            const size = radius * 2;          // diameter
            const opacity = rand(0.08, 0.2);  // low opacity
            const color = palette[Math.floor(Math.random() * palette.length)];

            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.style.opacity = opacity;
            el.style.background = color;
            // filter: blur(1px) is applied via the .particle CSS class

            const baseX = rand(0, w);
            const obj = {
              el: el,
              x: baseX,
              y: rand(0, h),
              baseX: baseX,
              amp: rand(8, 36),               // horizontal sway amplitude
              freq: rand(0.0004, 0.0014),     // sin-wave frequency
              phase: rand(0, Math.PI * 2),    // phase offset
              speed: rand(0.12, 0.4),         // upward drift speed (px/frame)
              w: w,
              h: h
            };
            field.appendChild(el);
            particles.push(obj);
          }
          requestAnimationFrame(animate);
        }

        function animate(t) {
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.y -= p.speed;                                       // drift upward
            p.x = p.baseX + Math.sin(t * p.freq + p.phase) * p.amp; // sin sway
            if (p.y < -10) {                                      // recycle at top
              p.y = p.h + 10;
              p.baseX = rand(0, p.w);
            }
            p.el.style.transform = 'translate3d(' + p.x + 'px,' + p.y + 'px,0)';
          }
          requestAnimationFrame(animate);
        }

        // Start the particle field after the 200ms boot delay
        setTimeout(createParticles, 200);

        // Keep bounds in sync on resize
        window.addEventListener('resize', function () {
          const w = window.innerWidth;
          const h = window.innerHeight;
          for (let i = 0; i < particles.length; i++) {
            particles[i].w = w;
            particles[i].h = h;
          }
        });
      })();
    </script>
  </body>
</html>
