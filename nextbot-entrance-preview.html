<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nextbot Entrance Preview</title>
    <style>
      :root {
        --bg-0: #010101;
        --bg-1: #050607;
        --bg-2: #0b0c10;
        --line: rgba(168, 215, 255, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 30%, rgba(33, 39, 46, 0.55), transparent 22%),
          radial-gradient(circle at 50% 48%, rgba(109, 201, 255, 0.07), transparent 18%),
          radial-gradient(circle at 50% 60%, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.9) 56%, #000 100%),
          linear-gradient(180deg, var(--bg-2), var(--bg-1) 42%, var(--bg-0));
        color: white;
        font-family: "Bahnschrift SemiCondensed", "Arial Narrow", "Segoe UI", sans-serif;
      }

      .stage {
        position: relative;
        min-height: 100vh;
        display: grid;
        place-items: center;
        isolation: isolate;
      }

      .stage::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 58%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--line), transparent);
        box-shadow: 0 0 22px rgba(121, 190, 255, 0.14);
      }

      .glow-orb {
        position: absolute;
        width: min(54vw, 580px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(248, 252, 255, 0.1), rgba(121, 195, 255, 0.06), transparent 70%);
        filter: blur(14px);
        animation: breathe 4.2s ease-out forwards;
      }

      .glow-band {
        position: absolute;
        width: min(46vw, 460px);
        height: 120px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.035), transparent);
        filter: blur(14px);
        animation: fade-in 1.6s ease-out forwards;
      }

      .copy {
        position: relative;
        width: min(88vw, 1080px);
        text-align: center;
        transform: translateY(44px) scale(0.82);
        opacity: 0;
        animation: title-stage 1.45s cubic-bezier(0.16, 1, 0.3, 1) 0.55s forwards;
      }

      .title-wrap {
        position: relative;
        display: inline-block;
      }

      .title-shadow {
        position: absolute;
        inset: 0;
        margin: 0;
        font-size: clamp(64px, 10vw, 118px);
        line-height: 0.96;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        transform: skewX(-4deg);
        color: rgba(203, 230, 255, 0.22);
        filter: blur(34px);
        opacity: 0;
        animation: title-fade 1.2s ease-out 0.72s forwards;
      }

      .title-base,
      .title-scan {
        margin: 0;
        font-size: clamp(64px, 10vw, 118px);
        line-height: 0.96;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        transform: skewX(-4deg);
      }

      .title-layer {
        position: relative;
        display: inline-block;
        opacity: 0;
        filter: blur(10px);
        clip-path: inset(0 100% 0 0);
        animation:
          title-fade 1.15s ease-out 0.72s forwards,
          title-unmask 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.72s forwards,
          title-sharpen 1.1s ease-out 0.72s forwards;
      }

      .title-base {
        position: relative;
        background: linear-gradient(180deg, #fdfeff, #d8e1ec 38%, #69717d);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow:
          0 0 12px rgba(255, 255, 255, 0.08),
          0 0 58px rgba(179, 217, 255, 0.12);
      }

      .title-scan {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            90deg,
            transparent 0%,
            rgba(255, 255, 255, 0.18) 64%,
            rgba(255, 255, 255, 0.96) 72%,
            rgba(217, 238, 255, 0.64) 78%,
            transparent 84%
          );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: brightness(1.1);
        opacity: 1;
      }

      .subtitle {
        margin-top: 22px;
        font-size: 11px;
        letter-spacing: 0.56em;
        color: rgba(232, 238, 248, 0.62);
        opacity: 0;
        animation: fade-in 0.9s ease-out 1.35s forwards;
      }

      .particle {
        position: absolute;
        border-radius: 50%;
        background: rgba(243, 250, 255, 0.62);
        box-shadow: 0 0 10px rgba(243, 250, 255, 0.18);
        animation: float 4.2s linear infinite;
      }

      .particle:nth-child(1) { width: 2px; height: 2px; left: 22%; top: 33%; animation-delay: -0.2s; }
      .particle:nth-child(2) { width: 2px; height: 2px; left: 36%; top: 49%; animation-delay: -1.1s; }
      .particle:nth-child(3) { width: 3px; height: 3px; left: 54%; top: 27%; animation-delay: -2s; }
      .particle:nth-child(4) { width: 2px; height: 2px; left: 63%; top: 39%; animation-delay: -0.8s; }
      .particle:nth-child(5) { width: 3px; height: 3px; left: 72%; top: 32%; animation-delay: -1.8s; }
      .particle:nth-child(6) { width: 2px; height: 2px; left: 80%; top: 46%; animation-delay: -1.4s; }

      @keyframes title-stage {
        from {
          transform: translateY(44px) scale(0.82);
          opacity: 0;
        }
        to {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
      }

      @keyframes title-fade {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes title-unmask {
        from { clip-path: inset(0 100% 0 0); }
        to { clip-path: inset(0 0 0 0); }
      }

      @keyframes title-sharpen {
        from { filter: blur(10px); }
        to { filter: blur(0); }
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes breathe {
        0% {
          transform: scale(0.84);
          opacity: 0.18;
        }
        48% {
          transform: scale(1);
          opacity: 1;
        }
        100% {
          transform: scale(1.04);
          opacity: 0.62;
        }
      }

      @keyframes float {
        0% {
          transform: translateY(0);
          opacity: 0.1;
        }
        50% {
          transform: translateY(-10px);
          opacity: 0.5;
        }
        100% {
          transform: translateY(-18px);
          opacity: 0.08;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="glow-orb"></div>
      <div class="glow-band"></div>

      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>

      <section class="copy">
        <div class="title-wrap">
          <h1 class="title-shadow">NEXTBOT</h1>
          <div class="title-layer">
            <h1 class="title-base">NEXTBOT</h1>
            <h1 class="title-scan">NEXTBOT</h1>
          </div>
        </div>
        <div class="subtitle">SYSTEM ONLINE</div>
      </section>
    </main>
  </body>
</html>
