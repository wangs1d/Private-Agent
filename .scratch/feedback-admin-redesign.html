<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>反馈管理 · 改版效果图</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --line: #e6e9ef; --line-soft: #eef1f5;
    --text: #171e2e; --muted: #697182; --faint: #9aa3b4;
    --accent: #2f6bff; --accent-deep: #2456d9; --accent-weak: #eef3ff;
    --side: #10141f; --side-text: #8b94a7;
    --ok: #16a34a; --bad: #dc2626; --warn: #d97706;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.03);
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 14px; line-height: 1.6;
  }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #d4dae4; border-radius: 8px; border: 2px solid var(--bg); }
  aside {
    position: fixed; left: 0; top: 0; bottom: 0; width: 212px;
    background: var(--side); color: var(--side-text);
    display: flex; flex-direction: column; padding: 20px 12px 14px;
  }
  aside .brand { color: #fff; font-size: 15px; font-weight: 600; padding: 0 10px; }
  aside .brand-sub { font-size: 11px; padding: 2px 10px 16px; border-bottom: 1px solid rgba(255,255,255,.08); }
  nav { margin-top: 14px; }
  nav a {
    display: block; padding: 8px 11px; margin: 2px 0; border-radius: 8px;
    color: var(--side-text); text-decoration: none; font-size: 13px;
  }
  nav a.on { background: rgba(47,107,255,.18); color: #fff; box-shadow: inset 2px 0 0 var(--accent); }
  main { margin-left: 212px; padding: 28px 32px 40px; max-width: 1400px; }
  h1 { font-size: 20px; font-weight: 650; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 18px; }
  .toolbar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); padding: 10px 14px; margin-bottom: 14px;
  }
  .seg { display: inline-flex; background: var(--line-soft); border-radius: 9px; padding: 2px; }
  .seg button {
    border: 0; background: transparent; padding: 5px 13px; cursor: pointer;
    font-size: 13px; color: var(--muted); border-radius: 7px; transition: all .12s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: #fff; color: var(--text); font-weight: 500; box-shadow: 0 1px 3px rgba(16,24,40,.12); }
  .seg .cnt {
    font-size: 11px; color: var(--faint); background: var(--line-soft);
    border-radius: 999px; padding: 0 7px; line-height: 17px;
  }
  .seg button.on .cnt { color: var(--accent); background: var(--accent-weak); }
  select, input[type=search] {
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 13px;
    background: #fff; color: var(--text);
  }
  input[type=search] { flex: 1; min-width: 160px; }
  .iconbtn {
    border: 1px solid var(--line); background: #fff; border-radius: 8px;
    width: 34px; height: 34px; cursor: pointer; color: var(--muted); font-size: 15px;
  }
  .iconbtn:hover { border-color: #c9d2e0; background: #f8fafc; }
  .split { display: grid; grid-template-columns: 396px 1fr; gap: 14px; align-items: start; }
  .pane {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  /* ---- 左列：紧凑行列表 ---- */
  .rows { max-height: 730px; overflow-y: auto; }
  .row {
    display: flex; gap: 10px; padding: 11px 14px; cursor: pointer;
    border-bottom: 1px solid var(--line-soft); border-left: 2px solid transparent;
    transition: background .1s;
  }
  .row:hover { background: #f8fafc; }
  .row.sel { background: var(--accent-weak); border-left-color: var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; }
  .dot.open { background: var(--warn); }
  .dot.processing { background: var(--accent); }
  .dot.resolved { background: var(--ok); }
  .rowmain { flex: 1; min-width: 0; }
  .rowtxt {
    font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; line-height: 1.45;
  }
  .rowmeta { font-size: 11.5px; color: var(--faint); margin-top: 1px; display: flex; gap: 6px; align-items: center; }
  .rowmeta .uid { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nbadge {
    flex: none; font-size: 10.5px; color: var(--accent); background: var(--accent-weak);
    border-radius: 999px; padding: 0 6px; line-height: 16px; margin-top: 1px;
  }
  .rowtime { flex: none; font-size: 11px; color: var(--faint); margin-top: 2px; }
  /* ---- 右列：详情面板 ---- */
  .detail { padding: 16px 20px 18px; max-height: 730px; overflow-y: auto; }
  .dhead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .dhead .typechip { font-size: 12px; border-radius: 999px; padding: 1px 10px; font-weight: 500; }
  .typechip.bug { background: #fee2e2; color: #dc2626; }
  .typechip.suggestion { background: #ede9fe; color: #7c3aed; }
  .typechip.other { background: #e9ecf1; color: #4b5563; }
  .statusseg { display: inline-flex; background: var(--line-soft); border-radius: 9px; padding: 2px; margin-left: auto; }
  .statusseg button {
    border: 0; background: transparent; padding: 4px 13px; cursor: pointer;
    font-size: 12.5px; color: var(--muted); border-radius: 7px;
  }
  .statusseg button.cur { background: #fff; font-weight: 550; box-shadow: 0 1px 3px rgba(16,24,40,.12); cursor: default; }
  .statusseg button.cur.open { color: var(--warn); }
  .statusseg button.cur.processing { color: var(--accent); }
  .statusseg button.cur.resolved { color: var(--ok); }
  .dbody { font-size: 14px; white-space: pre-wrap; padding: 2px 0 10px; }
  details.diag { border: 1px solid var(--line-soft); border-radius: 9px; padding: 7px 12px; margin-bottom: 14px; }
  details.diag summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
  details.diag table { border-collapse: collapse; margin-top: 8px; }
  details.diag td { font-size: 12px; padding: 3px 14px 3px 0; color: var(--muted); }
  details.diag td.kv-val { color: var(--text); font-family: Consolas, monospace; }
  .userbox { border: 1px solid var(--line-soft); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
  .userline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .uavatar {
    width: 26px; height: 26px; border-radius: 50%; background: var(--accent-weak); color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex: none;
  }
  .uid-full { font-family: Consolas, monospace; font-size: 12.5px; }
  .mini {
    border: 1px solid var(--line); background: #fff; border-radius: 7px; cursor: pointer;
    padding: 2px 9px; font-size: 11.5px; color: var(--muted);
  }
  .mini:hover { border-color: #c9d2e0; color: var(--text); }
  .hisrows { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 6px; display: none; }
  .userbox.exp .hisrows { display: block; }
  .hisrow {
    display: flex; gap: 8px; align-items: center; font-size: 12.5px; padding: 5px 4px;
    border-radius: 7px; cursor: pointer; color: var(--muted);
  }
  .hisrow:hover { background: var(--line-soft); color: var(--text); }
  .hisrow.cur { color: var(--text); font-weight: 500; }
  .hisrow .t { margin-left: auto; font-size: 11px; color: var(--faint); }
  .replylab { font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
  .replylab .hint { font-weight: 400; color: var(--faint); font-size: 11.5px; margin-left: 6px; }
  textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; font-size: 13px; font-family: inherit; resize: vertical; min-height: 64px;
  }
  .dactions { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .btn {
    border: 1px solid var(--line); background: #fff; border-radius: 8px;
    padding: 7px 15px; cursor: pointer; font-size: 13px; color: var(--text); font-weight: 500;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:disabled { background: #b9cdf8; border-color: #b9cdf8; cursor: default; }
  .metafoot { font-size: 11.5px; color: var(--faint); margin-top: 14px; display: flex; gap: 6px; align-items: center; }
  .metafoot .mono { font-family: Consolas, monospace; }
  .j/k-hint { color: var(--faint); }
  .kbd {
    font-size: 10.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px;
    padding: 0 5px; color: var(--faint); background: #fff;
  }
</style>
</head>
<body>
<aside>
  <div class="brand">Nextbot</div>
  <div class="brand-sub">管理控制台 · Private-Agent</div>
  <nav>
    <a href="#">概览</a><a href="#">用户</a><a href="#">站内信</a><a href="#">支付</a>
    <a href="#" class="on">反馈管理</a><a href="#">下载分发</a><a href="#">系统</a>
  </nav>
</aside>
<main>
  <h1>反馈管理</h1>
  <div class="sub">左列选条、右栏处理：状态流转 · 回复即站内信送达 · 按用户聚合视角</div>

  <div class="toolbar">
    <div class="seg" id="filterSeg"></div>
    <select><option>全部类型</option><option>问题报障</option><option>功能建议</option><option>其他</option></select>
    <input type="search" placeholder="搜索正文 / 用户 / 联系方式">
    <button class="iconbtn" title="刷新">⟳</button>
    <span style="margin-left:auto;font-size:11.5px;color:var(--faint)"><span class="kbd">J</span> <span class="kbd">K</span> 切换条目</span>
  </div>

  <div class="split">
    <div class="pane"><div class="rows" id="rows"></div></div>
    <div class="pane"><div class="detail" id="detail"></div></div>
  </div>
</main>

<script>
var DATA = [
  { id:"fb_57eb3197", title:"不行 ui差点意思", desc:"不行 ui差点意思", type:"bug", status:"open",
    actor:"inst_mubknkla_rzpb", time:"2026-09-23 21:55", short:"21:55",
    diag:{"客户端版本":"0.2.1","操作系统":"Windows 10 Pro 10.0 (Build 26200)","设备标识":"local-device","服务地址":"http://127.0.0.1:3000"} },
  { id:"fb_b69565bc", title:"不行", desc:"不行", type:"bug", status:"open",
    actor:"inst_mubknkla_rzpb", time:"2026-09-23 21:14", short:"21:14",
    diag:{"客户端版本":"0.2.1","操作系统":"Windows 10 Pro 10.0 (Build 26200)"} },
  { id:"fb_2c81aa40", title:"设置页点开就白屏，其他页面正常，重启后偶尔恢复", desc:"设置页点开就白屏，其他页面正常，重启后偶尔恢复。版本 0.2.1，Win11。", type:"bug", status:"open",
    actor:"inst_t6yn2wld", time:"2026-09-23 20:12", short:"20:12", diag:{} },
  { id:"fb_7d10e5b2", title:"建议支持深色模式，晚上用太刺眼", desc:"建议支持深色模式，晚上用太刺眼。最好跟随系统。", type:"suggestion", status:"processing",
    actor:"inst_p3wq8mvt", time:"2026-09-22 18:47", short:"昨天 18:47", diag:{} },
  { id:"fb_55aa019e", title:"日程提醒没有弹窗，错过一个会", desc:"日程提醒没有弹窗，错过一个会。右下角有时能弹有时不能。", type:"bug", status:"open",
    actor:"inst_k8lz4rna", time:"2026-09-22 10:31", short:"昨天 10:31", diag:{} },
  { id:"fb_88cc2f61", title:"导出聊天记录点导出报错 500", desc:"导出聊天记录点导出报错 500，重装也没用。", type:"bug", status:"resolved",
    actor:"inst_t6yn2wld", time:"2026-09-21 15:02", short:"09-21 15:02",
    reply:"0.2.1 已修复导出编码问题，升级后重新导出即可。" },
  { id:"fb_31de77c4", title:"搜索结果希望能一键复制链接", desc:"搜索结果希望能一键复制链接，现在只能整段复制文字。", type:"suggestion", status:"open",
    actor:"inst_p3wq8mvt", time:"2026-09-21 09:26", short:"09-21 09:26", diag:{} },
  { id:"fb_6b90aa13", title:"比价卡片的价格更新不及时", desc:"比价卡片的价格更新不及时，和实际页面差好几十。", type:"other", status:"processing",
    actor:"inst_mubknkla_rzpb", time:"2026-09-20 20:40", short:"09-20 20:40", diag:{} },
  { id:"fb_44f0c8d9", title:"侧栏消息角标点了不消失", desc:"侧栏消息角标点了不消失，得重启才消。", type:"bug", status:"resolved",
    actor:"inst_k8lz4rna", time:"2026-09-20 11:15", short:"09-20 11:15",
    reply:"已修复并随 0.2.1 发布。" },
  { id:"fb_5e21b7af", title:"希望日程能同步到手机日历", desc:"希望日程能同步到手机日历，出差只看手机。", type:"suggestion", status:"resolved",
    actor:"inst_9f2kx7qh", time:"2026-09-19 16:33", short:"09-19 16:33",
    reply:"已在规划，手机桥接方案落地后开放。" },
  { id:"fb_99aa31c0", title:"开机自启动偶尔失效", desc:"开机自启动偶尔失效，一周碰到的两次。", type:"bug", status:"resolved",
    actor:"inst_v4rh8qps", time:"2026-09-19 08:50", short:"09-19 08:50" },
  { id:"fb_70cc45e8", title:"更新提示能不能别在打字的时候弹", desc:"更新提示能不能别在打字的时候弹，正聊着突然被挡住。", type:"other", status:"resolved",
    actor:"inst_9f2kx7qh", time:"2026-09-18 22:05", short:"09-18 22:05" }
];
var STATUS_LABEL = { open:"待处理", processing:"处理中", resolved:"已解决" };
var TYPE_LABEL = { bug:"问题报障", suggestion:"功能建议", other:"其他" };
var byUser = {};
DATA.forEach(function (r) { (byUser[r.actor] = byUser[r.actor] || []).push(r); });

var selId = DATA[0].id, filter = "";

function countBy(st) { return DATA.filter(function (r) { return !st || r.status === st; }).length; }
function esc(s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderFilter() {
  var html = ['<button data-f="" class="' + (filter==""?"on":"") + '">全部 <span class="cnt">' + DATA.length + '</span></button>'];
  ["open","processing","resolved"].forEach(function (st) {
    html.push('<button data-f="' + st + '" class="' + (filter===st?"on":"") + '">' + STATUS_LABEL[st] +
      ' <span class="cnt">' + countBy(st) + '</span></button>');
  });
  document.getElementById("filterSeg").innerHTML = html.join("");
  document.querySelectorAll("#filterSeg button").forEach(function (b) {
    b.onclick = function () { filter = b.getAttribute("data-f"); renderFilter(); renderRows(); };
  });
}

function shortUid(a) { return a.length > 16 ? a.slice(0, 9) + "…" + a.slice(-4) : a; }

function renderRows() {
  var list = DATA.filter(function (r) { return !filter || r.status === filter; });
  document.getElementById("rows").innerHTML = list.map(function (r) {
    var n = (byUser[r.actor] || []).length;
    return '<div class="row ' + (r.id === selId ? "sel" : "") + '" data-id="' + r.id + '">' +
      '<span class="dot ' + r.status + '"></span>' +
      '<div class="rowmain"><div class="rowtxt">' + esc(r.desc.split("\n")[0]) + '</div>' +
      '<div class="rowmeta"><span class="uid">' + shortUid(r.actor) + '</span>' +
      (n > 1 ? '<span class="nbadge">×' + n + '</span>' : '') + '</div></div>' +
      '<span class="rowtime">' + r.short + '</span></div>';
  }).join("") || '<div style="padding:30px;text-align:center;color:var(--faint)">没有符合条件的反馈</div>';
  document.querySelectorAll(".row").forEach(function (el) {
    el.onclick = function () { selId = el.getAttribute("data-id"); renderRows(); renderDetail(); };
  });
}

function renderDetail() {
  var r = DATA.filter(function (x) { return x.id === selId; })[0];
  if (!r) { document.getElementById("detail").innerHTML = '<div style="padding:40px;text-align:center;color:var(--faint)">左侧选择一条反馈</div>'; return; }
  var his = byUser[r.actor] || [];
  var dedupTitle = r.desc.indexOf(r.title) === 0; // 自动派生标题 = 正文前缀 → 不重复展示
  var diagKeys = Object.keys(r.diag || {});
  var h = '<div class="dhead"><span class="typechip ' + r.type + '">' + TYPE_LABEL[r.type] + '</span>' +
    '<div class="statusseg">';
  ["open","processing","resolved"].forEach(function (st) {
    h += '<button class="' + (st === r.status ? "cur " + st : "") + '" data-st="' + st + '">' + STATUS_LABEL[st] + '</button>';
  });
  h += '</div></div>';
  h += '<div class="dbody">' + esc(r.desc) + (dedupTitle ? "" : "\n（标题：" + esc(r.title) + "）") + '</div>';
  if (diagKeys.length) {
    h += '<details class="diag"><summary>诊断信息 · ' + diagKeys.length + ' 项</summary><table>' +
      diagKeys.map(function (k) { return "<tr><td>" + esc(k) + '</td><td class="kv-val">' + esc(r.diag[k]) + "</td></tr>"; }).join("") +
      '</table></details>';
  }
  h += '<div class="userbox" id="userbox"><div class="userline">' +
    '<span class="uavatar">' + esc(r.actor.slice(5, 7).toUpperCase()) + '</span>' +
    '<span class="uid-full">' + esc(r.actor) + '</span>' +
    '<button class="mini" onclick="navigator.clipboard&&navigator.clipboard.writeText(\'' + r.actor + '\')">复制 ID</button>' +
    '<button class="mini" onclick="document.getElementById(\'userbox\').classList.toggle(\'exp\')">他的反馈 · ' + his.length + ' 条 ▾</button>' +
    '</div><div class="hisrows">' +
    his.map(function (x) {
      return '<div class="hisrow ' + (x.id === r.id ? "cur" : "") + '" onclick="selId=\'' + x.id + '\';renderRows();renderDetail()">' +
        '<span class="dot ' + x.status + '"></span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
        esc(x.desc.slice(0, 30)) + '</span><span>' + STATUS_LABEL[x.status] + '</span><span class="t">' + x.short + '</span></div>';
    }).join("") + '</div></div>';
  h += '<div class="replylab">回复用户 <span class="hint">保存后自动以站内信送达，用户端实时可见</span></div>';
  if (r.reply) h += '<div style="font-size:12.5px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:7px 11px;margin-bottom:8px;color:#15803d">已回复：' + esc(r.reply) + '</div>';
  h += '<textarea placeholder="' + (r.reply ? "补充新回复…" : "回复说明…（留空仅流转状态，不通知）") + '"></textarea>';
  h += '<div class="dactions"><button class="btn primary" id="saveBtn" ' + (r.reply ? "disabled" : "") + '>保存回复并通知</button>' +
    '<span style="font-size:11.5px;color:var(--faint)">状态变更即时生效，无需另存</span></div>';
  h += '<div class="metafoot"><span class="mono">#' + esc(r.id) + '</span>·<span>' + r.time + '</span>' +
    (r.contact ? '<span>·联系方式：' + esc(r.contact) + '</span>' : '') + '</div>';
  document.getElementById("detail").innerHTML = h;
  document.querySelectorAll(".statusseg button").forEach(function (b) {
    b.onclick = function () {
      if (b.classList.contains("cur")) return;
      r.status = b.getAttribute("data-st"); renderRows(); renderFilter(); renderDetail();
    };
  });
  var ta = document.querySelector(".detail textarea"), sb = document.getElementById("saveBtn");
  if (ta && sb) ta.oninput = function () { sb.disabled = ta.value.trim() === (r.reply || ""); };
}

renderFilter(); renderRows(); renderDetail();
document.addEventListener("keydown", function (e) {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  var list = DATA.filter(function (r) { return !filter || r.status === filter; });
  var i = list.findIndex(function (r) { return r.id === selId; });
  if (e.key === "j" && i < list.length - 1) { selId = list[i + 1].id; renderRows(); renderDetail(); }
  if (e.key === "k" && i > 0) { selId = list[i - 1].id; renderRows(); renderDetail(); }
});
</script>
</body>
</html>
