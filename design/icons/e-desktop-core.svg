<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c27a"/>
      <stop offset="1" stop-color="#8a5a24"/>
    </linearGradient>
  </defs>
  <!-- 桌面窗口轮廓（圆角矩形 + 顶部栏） -->
  <rect x="82" y="96" width="348" height="320" rx="36" ry="36"
        fill="none" stroke="url(#gE)" stroke-width="26"/>
  <!-- 顶部栏分隔线 -->
  <line x1="82" y1="180" x2="430" y2="180" stroke="url(#gE)" stroke-width="26"/>
  <!-- 窗口内：内核光点（Agent 核心） -->
  <circle cx="256" cy="288" r="38" fill="url(#gE)"/>
  <!-- 两侧能力小方块 -->
  <rect x="146" y="276" width="28" height="28" rx="8" fill="url(#gE)"/>
  <rect x="338" y="276" width="28" height="28" rx="8" fill="url(#gE)"/>
</svg>
