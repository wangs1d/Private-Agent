<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>私人管家 · 首次开场动画原型</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23f2e4c8' stroke-width='1.2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23f2e4c8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
/* ============ 基础 ============ */
:root{
  --bg:#08090b;
  --bg-2:#0d0e12;
  --glow:#f2e4c8;          /* 暖琥珀光：管家的克制与温度 */
  --glow-soft:rgba(242,228,200,.55);
  --glow-faint:rgba(242,228,200,.16);
  --ink:rgba(245,238,224,.94);
  --ink-dim:rgba(200,190,170,.60);
  --ink-faint:rgba(170,160,142,.38);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:1px solid var(--glow-soft);outline-offset:3px}

/* ============ 开场舞台 ============ */
#stage{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(60% 50% at 50% 46%, #101218 0%, var(--bg) 68%);
  transition:opacity .8s var(--ease), visibility .8s;
  z-index:10;
}
#stage.done{opacity:0;visibility:hidden;pointer-events:none}

.orb{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center}
.orb-core{
  width:10px;height:10px;border-radius:50%;
  background:var(--glow);
  box-shadow:0 0 18px 4px rgba(242,228,200,.55),0 0 60px 14px rgba(242,228,200,.18);
  opacity:0;transform:scale(.4);
}
.orb-ring{
  position:absolute;inset:0;border-radius:50%;
  border:1px solid var(--glow-faint);
  opacity:0;
}
.orb-ring::before{ /* 描边画出用的半弧 */
  content:"";position:absolute;inset:-1px;border-radius:50%;
  border:1px solid transparent;
  border-top-color:var(--glow-soft);border-right-color:var(--glow-soft);
}
.ripple{
  position:absolute;inset:0;border-radius:50%;
  border:1px solid var(--glow-soft);
  opacity:0;
}
/* 呼吸（苏醒后常驻） */
.orb.alive .orb-core{animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{
  0%,100%{transform:scale(1);box-shadow:0 0 18px 4px rgba(242,228,200,.5),0 0 60px 14px rgba(242,228,200,.15)}
  50%{transform:scale(1.18);box-shadow:0 0 26px 7px rgba(242,228,200,.65),0 0 80px 22px rgba(242,228,200,.22)}
}
/* 说话时的语音波形 */
.wave{position:absolute;bottom:-46px;left:50%;transform:translateX(-50%);display:flex;gap:5px;align-items:center;height:18px;opacity:0;transition:opacity .4s}
.wave i{width:2px;height:5px;border-radius:1px;background:var(--glow-soft);display:block}
.orb.speaking .wave{opacity:1}
.orb.speaking .wave i{animation:wv 1.05s ease-in-out infinite}
.orb.speaking .wave i:nth-child(1){animation-delay:0s}
.orb.speaking .wave i:nth-child(2){animation-delay:.14s}
.orb.speaking .wave i:nth-child(3){animation-delay:.28s}
.orb.speaking .wave i:nth-child(4){animation-delay:.42s}
.orb.speaking .wave i:nth-child(5){animation-delay:.56s}
@keyframes wv{0%,100%{height:5px}50%{height:17px}}

/* 台词 */
.script{
  position:absolute;left:50%;top:calc(50% + 132px);transform:translateX(-50%);
  text-align:center;width:max-content;max-width:86vw;
}
.line{
  font-family:var(--serif);
  font-weight:300;
  font-size:clamp(22px,3.4vw,34px);
  letter-spacing:.14em;
  color:var(--ink);
  white-space:nowrap;
}
.line + .line{margin-top:26px}
.line .ch{display:inline-block;opacity:0;transform:translateY(10px)}
.line.show .ch{animation:chIn .55s var(--ease) forwards}
@keyframes chIn{to{opacity:1;transform:translateY(0)}}
.line.old{transition:opacity .6s,color .6s;opacity:.32}
.line.old .ch{animation:none;opacity:.32;transform:none}
/* “我在”的脉冲由 JS 给 orb 加 pulse */
.orb.pulse .orb-core{animation:pulse 1.1s var(--ease)}
@keyframes pulse{
  0%{transform:scale(1)}
  35%{transform:scale(1.9);box-shadow:0 0 40px 10px rgba(242,228,200,.8),0 0 120px 40px rgba(242,228,200,.28)}
  100%{transform:scale(1)}
}
.orb.pulse .ripple-pulse{animation:rp 1.1s var(--ease)}
.ripple-pulse{position:absolute;inset:0;border-radius:50%;border:1px solid var(--glow-soft);opacity:0}
@keyframes rp{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(1.9)}}

/* ============ 终态：主界面（极简） ============ */
#home{
  position:fixed;inset:0;z-index:5;
  background:var(--bg-2);
  display:flex;flex-direction:column;
  opacity:0;visibility:hidden;
  transition:opacity .9s var(--ease) .2s, visibility .9s;
}
#home.show{opacity:1;visibility:visible}
.home-top{display:flex;align-items:center;gap:12px;padding:26px 32px;opacity:0}
.home-top .mini-orb{width:18px;height:18px;border-radius:50%;background:var(--glow);box-shadow:0 0 12px 2px rgba(242,228,200,.5);animation:breathe 3.6s ease-in-out infinite}
.home-top .name{font-family:var(--serif);letter-spacing:.22em;font-size:14px;color:var(--ink-dim)}
.home-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 24px;opacity:0}
.home-mid h1{font-family:var(--serif);font-weight:300;font-size:clamp(26px,3.6vw,40px);letter-spacing:.1em}
.home-mid p{font-size:14px;color:var(--ink-faint);letter-spacing:.12em}
.home-bottom{padding:0 32px 40px;display:flex;justify-content:center;opacity:0}
.input-bar{
  width:min(640px,92vw);
  border:1px solid rgba(242,228,200,.18);border-radius:999px;
  padding:16px 22px;display:flex;align-items:center;gap:14px;
  color:var(--ink-faint);font-size:14px;letter-spacing:.08em;
  transition:border-color .3s;
}
.input-bar:hover{border-color:var(--glow-faint)}
.input-bar .dot{width:6px;height:6px;border-radius:50%;background:var(--glow-soft);flex:none;animation:breathe 3.6s ease-in-out infinite}
.input-bar .send{margin-left:auto;color:var(--ink-dim);font-size:16px;line-height:1}
#home.show .home-top,#home.show .home-mid,#home.show .home-bottom{animation:chIn .9s var(--ease) forwards}
#home.show .home-mid{animation-delay:.35s}
#home.show .home-bottom{animation-delay:.5s}

/* ============ 开启遮罩 ============ */
#gate{
  position:fixed;inset:0;z-index:30;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
  transition:opacity .7s var(--ease),visibility .7s;
}
#gate.hide{opacity:0;visibility:hidden}
.gate-ring{
  width:96px;height:96px;border-radius:50%;
  border:1px solid var(--glow-faint);
  display:flex;align-items:center;justify-content:center;
  position:relative;transition:transform .4s var(--ease),border-color .4s;
}
.gate-ring::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid transparent;border-top-color:var(--glow-soft);animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gate-ring:hover{transform:scale(1.06);border-color:var(--glow-faint)}
.gate-ring .gate-core{width:8px;height:8px;border-radius:50%;background:var(--glow);box-shadow:0 0 16px 4px rgba(242,228,200,.5)}
.gate-tip{text-align:center}
.gate-tip .t1{font-family:var(--serif);font-weight:300;font-size:17px;letter-spacing:.3em;color:var(--ink-dim);margin-bottom:12px}
.gate-tip .t2{font-size:12px;letter-spacing:.14em;color:var(--ink-faint)}

/* ============ 右上角控件 ============ */
.controls{position:fixed;top:22px;right:26px;z-index:40;display:flex;gap:18px;align-items:center;opacity:0;transition:opacity .5s}
.controls.on{opacity:1}
.ctrl{font-size:12px;letter-spacing:.14em;color:var(--ink-faint);display:flex;align-items:center;gap:7px;padding:6px 4px;transition:color .3s}
.ctrl:hover{color:var(--ink-dim)}
.ctrl svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.4}
.ios-note{position:fixed;top:52px;right:26px;z-index:40;font-size:11px;color:var(--ink-faint);letter-spacing:.06em;opacity:0}
.ios-note.on{opacity:1}

@media (max-width:600px){
  .script{top:calc(50% + 108px)}
  .line + .line{margin-top:20px}
  .home-top{padding:20px}
  .controls{top:14px;right:12px}
  .ctrl{min-height:44px;min-width:44px;justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<!-- ===== 开场舞台 ===== -->
<div id="stage" aria-live="polite">
  <div class="orb" id="orb">
    <div class="ripple" id="ripple1"></div>
    <div class="ripple" id="ripple2"></div>
    <div class="ripple-pulse"></div>
    <div class="orb-ring" id="orbRing"></div>
    <div class="orb-core"></div>
    <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="script" id="script">
    <div class="line" id="l1"></div>
    <div class="line" id="l2"></div>
    <div class="line" id="l3"></div>
  </div>
</div>

<!-- ===== 终态主界面 ===== -->
<div id="home">
  <div class="home-top"><span class="mini-orb"></span><span class="name">私 人 管 家</span></div>
  <div class="home-mid">
    <h1>我在，听候你的吩咐</h1>
    <p>日程、提醒、琐事与决定，都可以交给我</p>
  </div>
  <div class="home-bottom">
    <div class="input-bar"><span class="dot"></span><span>有什么可以吩咐我的？</span><span class="send">↑</span></div>
  </div>
</div>

<!-- ===== 开启遮罩（点击同时解锁声音） ===== -->
<div id="gate">
  <button class="gate-ring" id="startBtn" aria-label="开始播放开场动画">
    <span class="gate-core"></span>
  </button>
  <div class="gate-tip">
    <div class="t1">点击开启</div>
    <div class="t2">首次启动 · 开场动画演示 · 约 12 秒，可随时跳过</div>
  </div>
</div>

<!-- ===== 控件 ===== -->
<div class="controls" id="controls">
  <button class="ctrl" id="soundBtn" role="switch" aria-checked="true">
    <svg id="icoSoundOn" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
    <svg id="icoSoundOff" viewBox="0 0 24 24" style="display:none"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>
    <span id="soundLabel">声音 开</span>
  </button>
  <button class="ctrl" id="skipBtn">跳过 ›</button>
  <button class="ctrl" id="replayBtn" style="display:none">重播</button>
</div>
<div class="ios-note" id="iosNote">如无声，请关闭 iPhone 侧边静音键</div>

<script>
/* ============ 文案（逐字拆分） ============ */
const LINES=[
  {id:"l1",text:"你好"},
  {id:"l2",text:"我是你的私人管家"},
  {id:"l3",text:"我在"}
];
LINES.forEach(L=>{
  const el=document.getElementById(L.id);
  el.innerHTML=[...L.text].map(c=>`<span class="ch">${c}</span>`).join("");
});

const $=id=>document.getElementById(id);
const stage=$("stage"),orb=$("orb"),home=$("home"),gate=$("gate"),controls=$("controls");
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);

/* ============ 时间线（秒） ============ */
const TL=[
  [0.4,"coreOn"],
  [1.2,"ripple1"],
  [2.0,"ringDraw"],
  [2.7,"ripple2"],
  [3.3,"alive"],
  [3.9,"say1"],
  [5.8,"say2"],
  [8.9,"say3"],
  [9.7,"pulse"],
  [11.2,"enterHome"]
];

/* ============ 音频（Web Audio 原生合成，动画驱动音频） ============ */
let actx=null,master=null,muted=false;
function initAudio(){
  if(actx) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  actx=new AC();
  master=actx.createGain();master.gain.value=muted?0:.22;master.connect(actx.destination);
  // 事件：[时间偏移, 频率, 时长, 音量]
  const notes=[[.4,196,2.4,.10],[1.2,293.7,1.8,.07],[2.0,392,2.2,.08],[2.7,587.4,1.6,.06],[3.9,523.3,1.0,.05],[5.8,440,1.2,.05],[8.9,392,1.6,.06],[9.7,659.3,1.8,.08]];
  window._noteT0=actx.currentTime+.15;
  notes.forEach(([dt,f,d,g])=>scheduleTone(window._noteT0+dt,f,d,g));
}
function scheduleTone(t,f,d,g){
  const o=actx.createOscillator(),gn=actx.createGain();
  o.type="sine";o.frequency.value=f;
  gn.gain.setValueAtTime(0,t);
  gn.gain.linearRampToValueAtTime(g,t+.5);
  gn.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(gn);gn.connect(master);
  o.start(t);o.stop(t+d+.05);
}

/* ============ 视觉动作 ============ */
const fired=new Set();
function act(name){
  if(fired.has(name))return;fired.add(name);
  const core=orb.querySelector(".orb-core"),ring=$("orbRing");
  switch(name){
    case "coreOn":
      core.style.transition="opacity 1s var(--ease),transform 1s var(--ease)";
      core.style.opacity=1;core.style.transform="scale(1)";break;
    case "ripple1":ripple($("ripple1"));break;
    case "ringDraw":
      ring.style.opacity=1;
      ring.animate([{clipPath:"inset(0 0 100% 0)"},{clipPath:"inset(0 0 0% 0)"}],{duration:1300,easing:"cubic-bezier(.22,1,.36,1)",fill:"forwards"});
      break;
    case "ripple2":ripple($("ripple2"));break;
    case "alive":orb.classList.add("alive");break;
    case "say1":say(0);break;
    case "say2":say(1);break;
    case "say3":say(2);break;
    case "pulse":orb.classList.add("pulse");break;
    case "enterHome":toHome();break;
  }
}
function ripple(el){
  el.animate([{opacity:.6,transform:"scale(.55)"},{opacity:0,transform:"scale(1.7)"}],{duration:1700,easing:"cubic-bezier(.22,1,.36,1)",fill:"forwards"});
}
function say(i){
  orb.classList.add("speaking");
  const lineEl=document.getElementById(LINES[i].id);
  lineEl.classList.add("show");
  lineEl.querySelectorAll(".ch").forEach((c,k)=>{c.style.animationDelay=(k*.09)+"s";});
  // 上一句变暗
  if(i>0){const prev=document.getElementById(LINES[i-1].id);prev.classList.add("old");}
  // 说完停波形（下一句开始时会重新加上，class 已在无妨）
  const dur=LINES[i].text.length*.09+.9;
  setTimeout(()=>orb.classList.remove("speaking"),dur*1000);
}
function toHome(){
  orb.classList.remove("speaking");
  // 光点飞向顶栏槽位
  const dock=document.querySelector(".mini-orb");
  const a=orb.getBoundingClientRect(),b=dock.getBoundingClientRect();
  const dx=(b.left+b.width/2)-(a.left+a.width/2);
  const dy=(b.top+b.height/2)-(a.top+a.height/2);
  const sc=b.width/10;
  stage.querySelector(".script").style.transition="opacity .6s";
  stage.querySelector(".script").style.opacity=0;
  orb.animate(
    [{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${dx}px,${dy}px) scale(${sc})`,opacity:.15}],
    {duration:1100,easing:"cubic-bezier(.4,0,.2,1)",fill:"forwards"}
  );
  setTimeout(()=>{
    stage.classList.add("done");
    home.classList.add("show");
    dock.style.opacity=0;
    setTimeout(()=>{dock.style.transition="opacity .5s";dock.style.opacity=1;},400);
    $("skipBtn").style.display="none";
    $("replayBtn").style.display="";
  },650);
}

/* ============ 播放控制 ============ */
let rafId=null,tStart=0;
function play(){
  fired.clear();
  if(reduced){ // 减弱动效：直接终态
    toHome();return;
  }
  gate.classList.add("hide");
  controls.classList.add("on");
  if(isIOS&&!muted)$("iosNote").classList.add("on");
  initAudio();
  if(actx&&actx.state==="suspended")actx.resume();
  tStart=performance.now();
  const tick=()=>{
    const t=(performance.now()-tStart)/1000;
    for(const[at,name]of TL){if(t>=at)act(name);}
    if(!fired.has("enterHome"))rafId=requestAnimationFrame(tick);
  };
  rafId=requestAnimationFrame(tick);
}
function reset(){
  cancelAnimationFrame(rafId);
  fired.clear();
  stage.classList.remove("done");
  home.classList.remove("show");
  orb.classList.remove("alive","speaking","pulse");
  orb.style.animation="";
  orb.getAnimations().forEach(a=>a.cancel());
  document.querySelectorAll(".ripple,.orb-ring").forEach(e=>e.getAnimations().forEach(a=>a.cancel()));
  const core=orb.querySelector(".orb-core");
  core.style.opacity=0;core.style.transform="scale(.4)";
  $("orbRing").style.opacity=0;
  document.querySelectorAll(".line").forEach(l=>{l.classList.remove("show","old");});
  const sc=stage.querySelector(".script");sc.style.opacity=1;
  document.querySelector(".mini-orb").style.opacity=1;
  $("skipBtn").style.display="";
  $("replayBtn").style.display="none";
}

$("startBtn").addEventListener("click",play);
$("skipBtn").addEventListener("click",()=>{ // 跳过：清理未触发动作，直入终态
  fired.add("coreOn");fired.add("ripple1");fired.add("ringDraw");fired.add("ripple2");fired.add("alive");
  fired.add("say1");fired.add("say2");fired.add("say3");fired.add("pulse");
  document.querySelectorAll(".line").forEach(l=>l.classList.add("old"));
  toHome();
});
$("replayBtn").addEventListener("click",()=>{reset();setTimeout(play,120);});

/* 声音开关 */
$("soundBtn").addEventListener("click",()=>{
  muted=!muted;
  if(master)master.gain.linearRampToValueAtTime(muted?0:.22,actx.currentTime+.08);
  $("icoSoundOn").style.display=muted?"none":"";
  $("icoSoundOff").style.display=muted?"":"none";
  $("soundLabel").textContent=muted?"声音 关":"声音 开";
  $("soundBtn").setAttribute("aria-checked",String(!muted));
  if(!muted)$("iosNote").classList.remove("on");
});
</script>
</body>
</html>
