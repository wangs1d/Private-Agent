name: private_ai_agent
description: Private AI agent MVP client
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4
  crypto: ^3.0.5
  http: ^1.2.2
  file_picker: ^8.1.6
  camera: ^0.11.0+2
  audioplayers: ^6.1.0
  url_launcher: ^6.3.0
  webview_windows: ^0.4.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  geolocator: ^13.0.2
  image_picker: ^1.0.7
  video_player: ^2.8.5
  qr_flutter: ^4.1.0
  # 语音消息录音（agent 发送/接收语音消息的底层能力）
  record: ^5.2.0
  # 桌面端窗口控制（隐藏/显示/置顶）
  window_manager: ^0.4.3
  flutter_timezone: ^5.1.0

dependency_overrides:
  # 镜像源上 record_linux 0.7.2 与 record_platform_interface 1.6.0 接口签名不兼容
  # (RecordLinux.hasPermission 缺少 named args / 缺实现), 强制升级到 1.x+
  record_linux: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  assets:
    - assets/agent_avatars/
    - assets/fonts/
  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.otf
          weight: 400
        - asset: assets/fonts/MiSans-Medium.otf
          weight: 500
        - asset: assets/fonts/MiSans-Semibold.otf
          weight: 600
        - asset: assets/fonts/MiSans-Bold.otf
          weight: 700
