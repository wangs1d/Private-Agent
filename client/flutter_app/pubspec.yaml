name: private_ai_agent
description: Private AI agent MVP client
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.1
  path_provider: ^2.1.4
  crypto: ^3.0.5
  http: ^1.2.2
  file_picker: ^8.1.6
  audioplayers: ^6.1.0
  url_launcher: ^6.3.0
  webview_windows: ^0.4.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  geolocator: ^13.0.2
  image_picker: ^1.0.7
  video_player: ^2.8.5
  qr_flutter: ^4.1.0
  # 桌面端窗口控制（隐藏/显示/置顶）
  window_manager: ^0.4.3
  flutter_timezone: ^5.1.0
  flutter_local_notifications: ^22.3.0
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/agent_avatars/
    - assets/fonts/
    # 旅游行程地图模块（内嵌 MapLibre GL JS 单文件页面）
    - assets/travel_map/
  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.otf
          weight: 400
        - asset: assets/fonts/MiSans-Medium.otf
          weight: 500
        - asset: assets/fonts/MiSans-Semibold.otf
          weight: 600
        - asset: assets/fonts/MiSans-Bold.otf
          weight: 700
