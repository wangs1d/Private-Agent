<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>NEXTBOT 桌面注册界面 · 预览</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #0a0b0d;
    color: #e8eaed;
    font-family: "Inter", "Noto Sans SC", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 32px 24px 48px;
  }
  header { margin-bottom: 20px; text-align: center; }
  h1 { font-size: 16px; font-weight: 600; letter-spacing: .04em; }
  p.sub { margin-top: 6px; font-size: 12px; color: #8b9098; }
  .stage {
    width: 100%; max-width: 1200px;
    border: 1px solid #22252b; border-radius: 12px;
    background: #101216; padding: 16px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }
  .stage img { width: 100%; height: auto; display: block; border-radius: 6px; }
  .meta { margin-top: 14px; font-size: 12px; color: #8b9098; text-align: center; }
</style>
</head>
<body>
  <header>
    <h1>NEXTBOT · 桌面注册界面</h1>
    <p class="sub">1600 × 1000 · 黑底光感 · 球体助手内嵌卡片</p>
  </header>
  <div class="stage">
    <img src="NEXTBOT-注册界面-1600x1000.png" alt="NEXTBOT 桌面注册界面">
  </div>
  <div class="meta">右侧球体为 DG2 形象：金属外壳 + 黑玻璃面部 + 左右双侧耳</div>
</body>
</html>
